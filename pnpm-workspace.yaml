packages:
  - 'packages/*'
# Pinned out of `pnpm update`:
# - @stoplight/spectral-cli@6.16.1 pulls rollup@2.80.0, which trips the
#   no-downgrade trust policy below (possible package takeover). Keep the CLI at
#   its current version rather than weakening the trust guard; revisit once
#   spectral ships a release without the flagged rollup.
# - typescript@7.x (tsgo native port) breaks the toolchain: @hey-api/openapi-ts
#   (SDK generator) and @typescript-eslint/typescript-estree both fail against
#   it. Stay on 6.x until those support TS 7.
# - eslint held at 9.x: 10.x is not adopted yet in this repo's config stack.
# - google-auth-library held at 10.x: `@ai-sdk/google-vertex` asks for ^10.6.2,
#   and `vertexAwsCredentials.ts` hands it an `AuthClient` built here. A second
#   copy in the graph is both a type error and an `instanceof` hazard at
#   runtime, so this tracks whatever the Vertex provider depends on.
updateConfig:
  ignoreDependencies:
    - '@stoplight/spectral-cli'
    - 'typescript'
    - 'eslint'
    - 'google-auth-library'
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'carlin'
  - '@ttoss/*'
  - 'pnpm'
blockExoticSubdeps: true
trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # https://github.com/storybookjs/storybook/issues/34957
  # https://github.com/TypeStrong/fork-ts-checker-webpack-plugin/issues/895
  - chokidar
  # Docusaurus dependencies
  - detect-port
  # Relay/fbjs
  - ua-parser-js
  # tsdown, lint-staged, @commitlint/cli, @lerna-lite/core, Docusaurus mermaid path
  - tinyexec
  # semver@6.3.1 comes from Babel stack, especially @babel/core
  - semver
  - '@octokit/webhooks'
  - 'react-redux'
  - 'reselect'
  - 'undici-types'
  - '@ttoss/*'
  - carlin
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  aws-sdk: true
  core-js: true
  cpu-features: true
  esbuild: true
  msw: false
  postman-code-generators: false
  protobufjs: true
  ssh2: true
  unrs-resolver: true
# Each pin is the last release the resolver may take, held here rather than in
# `trustPolicyExclude` so the trust guard stays in force. Drop an entry once
# the named upstream ships a release that no longer needs it.
overrides:
  # eslint-plugin-formatjs imports `.../Binary_Property/*/regex.js` but ranges
  # on `2`, and 2.0.7 ships .mjs only, so eslint fails to load. Same tables.
  '@unicode/unicode-17.0.0': 2.0.6
  # 7.4.6 is a 7.x backport published after 8.x began shipping provenance, so
  # it reads as a trust downgrade. Waits on docusaurus moving to 8.
  webpack-dev-middleware: 7.4.5
  # 6.3.3 carries no trust evidence where 6.3.2 had provenance; the plugin that
  # pulls it asks for ^6.0.0.
  openapi-to-postmanv2: 6.3.2
  # 3.34.1 carries no trust evidence where earlier releases had a publisher.
  cytoscape: 3.34.0
