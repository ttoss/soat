name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.pull_request.title, 'chore(release):')"
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` is true when the PR touches any file other than Markdown.
          # When only `*.md` files change, `code` is false and the build,
          # smoke, and tutorial jobs are skipped (docs-lint still runs).
          filters: |
            code:
              - '!**/*.md'

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.pull_request.title, 'chore(release):')"

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docs lint (drift guardrail)
        run: pnpm run docs-lint

      - name: Test test-harness scripts
        run: pnpm run test:harness

  build-test-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest
    needs: changes
    if: "!startsWith(github.event.pull_request.title, 'chore(release):') && needs.changes.outputs.code == 'true'"
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # The server suite runs in the `server-tests` shard matrix instead — it is
      # the long pole, and sharding it is what keeps this job off the critical
      # path. Its build, typecheck and lint still run here; only its `test` is
      # elsewhere.
      #
      # `deploy` needs the same filter, not just `test`: turbo's `deploy` task
      # declares `dependsOn: ["build", "test"]`, so an unfiltered `run deploy`
      # would schedule `@soat/server#test` as a dependency and run the whole
      # suite here anyway. `@soat/server` has no deploy script and nothing
      # deployable depends on it, so excluding it drops nothing.
      - name: Build, test and deploy
        run: |
          pnpm turbo run build typecheck lint
          pnpm turbo run test --filter='!@soat/server'
          pnpm turbo run deploy --filter='!@soat/server'
        env:
          CARLIN_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Deploy report
        run: pnpm carlin deploy report --channel=github-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CARLIN_BRANCH: ${{ github.event.pull_request.head.ref }}

  server-tests:
    name: Server Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: changes
    if: "!startsWith(github.event.pull_request.title, 'chore(release):') && needs.changes.outputs.code == 'true'"

    strategy:
      # Every shard should report, so one failure does not hide the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests import the server from `src`, so only its workspace
      # dependencies need building — not the server bundle itself.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter='@soat/server^...'

      # `--coverageThreshold={}` disables the gate *per shard*: no shard sees
      # more than its slice of the source, so every one of them would fail it.
      # The thresholds are enforced once over the merged coverage, in
      # `server-coverage`.
      - name: Run tests
        run: >
          pnpm --filter @soat/server exec jest --projects tests/unit
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --coverageReporters=json
          --coverageThreshold={}

      - name: Upload shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: packages/server/tests/unit/coverage/coverage-final.json
          retention-days: 1

  server-coverage:
    name: Server Coverage
    runs-on: ubuntu-latest
    needs: [changes, server-tests]
    if: "!startsWith(github.event.pull_request.title, 'chore(release):') && needs.changes.outputs.code == 'true'"

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `merge-multiple`: every shard's file is named `coverage-final.json`,
      # so they need one directory each.
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      # The thresholds come from jest.config.ts, never a copy of it.
      - name: Resolve Jest config
        working-directory: packages/server
        run: pnpm exec jest --projects tests/unit --showConfig > "$RUNNER_TEMP/jest-config.json"

      - name: Enforce coverage thresholds
        run: >
          node scripts/mergeCoverage.mjs
          --config "$RUNNER_TEMP/jest-config.json"
          --cwd packages/server
          coverage-shards/*/coverage-final.json

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: changes
    if: "!startsWith(github.event.pull_request.title, 'chore(release):') && needs.changes.outputs.code == 'true'"

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          docker system prune -af

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ollama
        uses: ./.github/actions/setup-ollama

      - name: Run smoke tests
        run: pnpm run smoke-tests
        env:
          COMPOSE_BAKE: '1'

  tutorials-test:
    name: Tutorials Tests
    runs-on: ubuntu-latest
    needs: changes
    if: "!startsWith(github.event.pull_request.title, 'chore(release):') && needs.changes.outputs.code == 'true'"

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          docker system prune -af

      - name: Setup Ollama
        uses: ./.github/actions/setup-ollama

      - name: Run tutorials tests
        run: docker compose -f tests/docker-compose.tutorials.yml up --build --renew-anon-volumes --remove-orphans --abort-on-container-exit --exit-code-from tutorials

      - name: Cleanup tutorials stack
        if: always()
        run: docker compose -f tests/docker-compose.tutorials.yml down --volumes

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - docs-lint
      - build-test-and-deploy
      - server-tests
      - server-coverage
      - smoke-test
      - tutorials-test
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          for result in \
            "${{ needs.docs-lint.result }}" \
            "${{ needs.build-test-and-deploy.result }}" \
            "${{ needs.server-tests.result }}" \
            "${{ needs.server-coverage.result }}" \
            "${{ needs.smoke-test.result }}" \
            "${{ needs.tutorials-test.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more jobs failed."
              exit 1
            fi
          done
          echo "All checks passed."
