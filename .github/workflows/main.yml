name: Main

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # `pr.yml` skips every job on a `chore(release):` PR, so this workflow is the
  # only one to see the release commit. That commit is usually the previous
  # PR's tree plus version bumps, tested a minute earlier. The gate proves that
  # (see `scripts/releaseTestGate.mjs`) and, when it can, skips the test jobs
  # below; when it cannot, or errors, they run as before.
  release-test-gate:
    name: Release Test Gate
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tested: ${{ steps.gate.outputs.tested }}

    steps:
      - uses: actions/checkout@v6
        with:
          # The release commit and its parent.
          fetch-depth: 2

      - name: Check whether the release tree was already tested
        id: gate
        run: node scripts/releaseTestGate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: release-test-gate
    if: needs.release-test-gate.outputs.tested != 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test
        run: pnpm turbo run build typecheck lint test

      - name: Test test-harness scripts
        run: pnpm run test:harness

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: release-test-gate
    if: needs.release-test-gate.outputs.tested != 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          docker system prune -af

      - uses: pnpm/action-setup@v6

      # See the note in pr.yml: `pnpm run smoke-tests` is a `docker compose up`,
      # so the workspace install here read nothing.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Ollama
        uses: ./.github/actions/setup-ollama

      - name: Run smoke tests
        run: pnpm run smoke-tests
        env:
          COMPOSE_BAKE: '1'

      # See the note in pr.yml: the tool_choice shim's stdout is not attached by
      # `up`, so dump it when the stack fails.
      - name: Smoke stack logs (on failure)
        if: failure()
        run: docker compose -f tests/docker-compose.smoke.yml logs --no-color --tail=400 ollama-tool-choice

  push-release-tag:
    name: Push Release Tag
    runs-on: ubuntu-latest
    needs: [release-test-gate, build-and-test, smoke-test, tutorials-test]
    # The test jobs are skipped when the gate proved the tree tested, and a
    # skipped need would skip this job too — so require the gate itself to
    # pass and no test job to have failed or been cancelled instead.
    if: >-
      !cancelled()
      && needs.release-test-gate.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read version from lerna.json
        id: version
        run: echo "version=$(node -e "console.log(require('./lerna.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: Release Packages and Website
    needs: push-release-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so Docusaurus showLastUpdateTime / sitemap lastmod
          # resolve real per-file git dates instead of the HEAD commit date.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK and CLI
        run: pnpm turbo run build --filter=@soat/sdk --filter=@soat/cli

      # Published via npm trusted publishing (OIDC), not a token: the `id-token:
      # write` permission above lets pnpm exchange a GitHub OIDC token for a
      # short-lived npm credential. Each package registers this repo and the
      # workflow *filename* (`main.yml`) as its trusted publisher on npmjs.com,
      # so renaming this file breaks the release until npm is updated to match.
      # npm generates provenance attestations automatically here — `--provenance`
      # is not needed.
      - name: Publish SDK and CLI
        run: |
          pnpm --filter @soat/sdk publish --no-git-checks
          pnpm --filter @soat/cli publish --no-git-checks

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Website
        run: pnpm turbo run deploy --filter=@soat/website -- -e Production
        env:
          CARLIN_BRANCH: main
          CARLIN_ACM: ${{ vars.AWS_ACM }}

  publish-docker:
    name: Publish Docker Image
    needs: push-release-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ttoss/soat
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.push-release-tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.push-release-tag.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true

      - name: Attest Docker image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/ttoss/soat
          subject-digest: ${{ steps.build.outputs.digest }}

  tutorials-test:
    name: Tutorials Tests
    runs-on: ubuntu-latest
    needs: release-test-gate
    if: needs.release-test-gate.outputs.tested != 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          docker system prune -af

      - name: Setup Ollama
        uses: ./.github/actions/setup-ollama

      - name: Run tutorials tests
        run: docker compose -f tests/docker-compose.tutorials.yml up --build --renew-anon-volumes --remove-orphans --abort-on-container-exit --exit-code-from tutorials

      # See the note in pr.yml: the tool_choice shim's stdout is not attached by
      # `up`, so dump it when the stack fails.
      - name: Tutorials stack logs (on failure)
        if: failure()
        run: docker compose -f tests/docker-compose.tutorials.yml logs --no-color --tail=400 ollama-tool-choice

      - name: Cleanup tutorials stack
        if: always()
        run: docker compose -f tests/docker-compose.tutorials.yml down --volumes
