openapi: 3.0.3
info:
  title: SOAT Files API
  version: 1.0.0
  description: API for managing files (Files resource)
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Files
    description: Manage files
security:
  - bearerAuth: []
paths:
  /api/v1/files:
    get:
      tags:
        - Files
      summary: List all files
      description: Returns a list of all stored files
      operationId: listFiles
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - INVALID_CURSOR
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: files:GetFile
      x-iam-resource-type: file
      parameters:
        - name: project_id
          in: query
          required: false
          description: Filter files by project ID
          schema:
            type: string
            example: 'proj_V1StGXR8Z5jdHi6B'
        - name: path_prefix
          in: query
          required: false
          description: >-
            Only files under this directory. The prefix is a path boundary, not
            a substring: `/reports` returns `/reports/q1.txt` and never
            `/reports-archive/q1.txt`, and `/` selects the whole project. A
            leading slash is optional and a trailing one is ignored, so
            `reports`, `/reports` and `/reports/` are the same filter. `%` and
            `_` are literal characters, not wildcards. Naming a directory under
            `/.system/` is what includes platform-written files, which a list
            without this parameter leaves out.
          schema:
            type: string
            example: '/reports/'
        - $ref: './tags.yaml#/components/parameters/TagsQuery'
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: List of files returned successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FileRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
    post:
      tags:
        - Files
      summary: Create a file
      description: Creates a new file record in the system
      operationId: createFile
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - NAME_CONFLICT
        - QUOTA_EXCEEDED
        - QUOTA_STORAGE_EXCEEDED
        - QUOTA_UNENFORCEABLE
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: files:CreateFile
      x-iam-resource-type: file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  x-soat-ref: projects
                  type: string
                  description: Public ID of the project. Optional when authenticating with a project-scoped API key, which defaults to the key's project; required otherwise.
                  example: 'proj_V1StGXR8Z5jdHi6B'
                prefix:
                  type: string
                  description: Directory within the project (e.g. /images). Optional; defaults to / (root). Combined with filename to form the file's key (path).
                  example: '/images'
                filename:
                  type: string
                  description: Original / download name and the key's leaf segment (e.g. logo.png).
                  example: 'logo.png'
                content_type:
                  type: string
                  description: MIME type of the file
                  example: 'application/pdf'
                size:
                  type: integer
                  nullable: true
                  description: File size in bytes
                  example: 1024
                metadata:
                  $ref: './metadata.yaml#/components/schemas/MetadataBag'
                expires_in:
                  $ref: '#/components/schemas/FileExpiresIn'
                expires_at:
                  $ref: '#/components/schemas/FileExpiresAt'
                delete_after:
                  $ref: '#/components/schemas/FileDeleteAfter'
      responses:
        '201':
          description: File created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '409':
          description: >-
            The project's `storage_bytes` quota is exceeded
            (`QUOTA_STORAGE_EXCEEDED`). Delete stored content, or raise the
            quota — no window reset clears a stored total, so no `Retry-After`
            is sent.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/files/upload:
    post:
      tags:
        - Files
      summary: Upload a file
      description: Uploads a file to the server and stores it in the configured storage directory
      operationId: uploadFile
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - NAME_CONFLICT
        - QUOTA_EXCEEDED
        - QUOTA_STORAGE_EXCEEDED
        - QUOTA_UNENFORCEABLE
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: files:UploadFile
      x-iam-resource-type: file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File content
                project_id:
                  x-soat-ref: projects
                  type: string
                  description: Project ID to associate the file with. Optional when authenticating with a project-scoped API key, which defaults to the key's project; required otherwise.
                  example: 'proj_V1StGXR8Z5jdHi6B'
                prefix:
                  type: string
                  description: Directory within the project (e.g. /images). Optional; defaults to / (root).
                  example: '/images'
                filename:
                  type: string
                  description: Original / download name. Optional; defaults to the uploaded file's name.
                  example: 'logo.png'
                metadata:
                  $ref: './metadata.yaml#/components/schemas/MetadataBagText'
                expires_in:
                  type: string
                  pattern: '^[0-9]+$'
                  description: >-
                    Seconds until the file is deleted, as the form field's
                    text. Not with `expires_at`.
                  example: '3600'
                expires_at:
                  $ref: '#/components/schemas/FileExpiresAt'
                delete_after:
                  $ref: '#/components/schemas/FileDeleteAfter'
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '400':
          description: Missing file or invalid project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '409':
          description: >-
            The project's `storage_bytes` quota is exceeded
            (`QUOTA_STORAGE_EXCEEDED`). Delete stored content, or raise the
            quota — no window reset clears a stored total, so no `Retry-After`
            is sent.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          description: >-
            The upload is over this deployment's byte ceiling
            (`UPLOAD_TOO_LARGE`; `FILE_UPLOAD_MAX_BYTES`, 25 MB by default).
            The request is refused while the body is still streaming, so
            nothing was stored.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/files/upload/base64:
    post:
      tags:
        - Files
      summary: Upload a file using base64 encoding
      description: Uploads a file to the server using base64-encoded content
      operationId: uploadFileBase64
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - NAME_CONFLICT
        - QUOTA_EXCEEDED
        - QUOTA_STORAGE_EXCEEDED
        - QUOTA_UNENFORCEABLE
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: files:UploadFile
      x-iam-resource-type: file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileBase64Request'
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '400':
          description: Missing content or invalid project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '409':
          description: >-
            The project's `storage_bytes` quota is exceeded
            (`QUOTA_STORAGE_EXCEEDED`). Delete stored content, or raise the
            quota — no window reset clears a stored total, so no `Retry-After`
            is sent.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/files/presigned-url:
    post:
      tags:
        - Files
      summary: Create a presigned upload URL
      description: >-
        Creates a short-lived, single-use presigned upload URL — the
        local-storage equivalent of an S3 presigned URL. The token fixes where
        the file lands, its byte ceiling (`max_bytes`) and, when
        `content_type` is given, its type. The client then uploads the file to
        the returned `upload_url` with no credential: as the raw body with
        `PUT /api/v1/files/upload/{token}` (what a browser sends), or as
        multipart or base64 with `POST /api/v1/files/upload/{token}`.
      operationId: createPresignedUrl
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - RESERVED_PATH
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: files:UploadFile
      x-iam-resource-type: file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUrlRequest'
      responses:
        '201':
          description: Presigned URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: Missing or invalid project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/files/upload/{token}:
    post:
      tags:
        - Files
      summary: Upload a file using an upload token
      description: >-
        Uploads file content authorized by a single-use token from
        `POST /api/v1/files/presigned-url`. No bearer credential is required —
        the token is the credential. Accepts either multipart/form-data (field
        `file`) or JSON with a base64-encoded `content` field.
      operationId: uploadFileWithToken
      x-raises:
        - FILE_STORAGE_MISCONFIGURED
        - NAME_CONFLICT
        - QUOTA_EXCEEDED
        - QUOTA_STORAGE_EXCEEDED
        - QUOTA_UNENFORCEABLE
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - UPLOAD_CONTENT_TYPE_MISMATCH
        - UPLOAD_TOKEN_EXPIRED
        - UPLOAD_TOKEN_NOT_FOUND
        - UPLOAD_TOKEN_USED
        - UPLOAD_TOO_LARGE
        - VALIDATION_FAILED
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The single-use upload token (e.g. upt_...)
          schema:
            type: string
            example: 'upt_V1StGXR8Z5jdHi6B'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File content
                metadata:
                  $ref: './metadata.yaml#/components/schemas/MetadataBagText'
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileWithTokenRequest'
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '400':
          description: Missing content
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Upload token not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Upload token already used, or the project's `storage_bytes` quota
            is exceeded (`QUOTA_STORAGE_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '410':
          description: Upload token expired
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          description: >-
            The upload is over the token's `max_bytes` or this deployment's
            byte ceiling (`UPLOAD_TOO_LARGE`). Nothing was stored, and the
            token can still be used.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '415':
          description: >-
            The file's content type is not the one the token fixes
            (`UPLOAD_CONTENT_TYPE_MISMATCH`). Nothing was stored, and the token
            can still be used.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    put:
      tags:
        - Files
      summary: Upload a raw file body with an upload token
      description: >-
        Uploads file content authorized by a single-use token from
        `POST /api/v1/files/presigned-url`, sending the file itself as the
        request body, so a browser can `PUT` a `File` to the token's
        `upload_url` with no credential. The body is streamed to storage. It
        must declare its size in `Content-Length`, at most the token's
        `max_bytes`; when the token fixes a content type, `Content-Type` must
        match it. A refused upload leaves the token usable.
      operationId: putFileWithToken
      x-raises:
        - FILE_STORAGE_MISCONFIGURED
        - NAME_CONFLICT
        - QUOTA_EXCEEDED
        - QUOTA_STORAGE_EXCEEDED
        - QUOTA_UNENFORCEABLE
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - UPLOAD_CONTENT_TYPE_MISMATCH
        - UPLOAD_LENGTH_REQUIRED
        - UPLOAD_TOKEN_EXPIRED
        - UPLOAD_TOKEN_NOT_FOUND
        - UPLOAD_TOKEN_USED
        - UPLOAD_TOO_LARGE
        - VALIDATION_FAILED
      # Its body is the file's raw bytes, which a tool call's JSON arguments
      # cannot carry; tools upload through uploadFileWithToken.
      x-soat-mcp-exclude: true
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The single-use upload token (e.g. upt_...)
          schema:
            type: string
            example: 'upt_V1StGXR8Z5jdHi6B'
        - name: Content-Length
          in: header
          required: true
          description: >-
            The file's size in bytes, at most the token's `max_bytes`. A body
            without it is refused with `411 UPLOAD_LENGTH_REQUIRED`.
          schema:
            type: integer
            minimum: 0
        - name: Content-Type
          in: header
          required: false
          description: >-
            The file's content type, stored on the file. When the token fixes
            one, it must match (`415 UPLOAD_CONTENT_TYPE_MISMATCH`).
          schema:
            type: string
      requestBody:
        required: true
        content:
          '*/*':
            schema:
              type: string
              format: binary
              description: The file content
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '404':
          description: Upload token not found (`UPLOAD_TOKEN_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Upload token already used, a file already at the token's path, or
            the project's `storage_bytes` quota is exceeded
            (`QUOTA_STORAGE_EXCEEDED`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '410':
          description: Upload token expired (`UPLOAD_TOKEN_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '411':
          description: >-
            The body declares no `Content-Length` (`UPLOAD_LENGTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          description: >-
            `Content-Length` is over the token's `max_bytes` or this
            deployment's byte ceiling (`UPLOAD_TOO_LARGE`), refused before the
            body is read. The token can still be used.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '415':
          description: >-
            `Content-Type` is not the one the token fixes
            (`UPLOAD_CONTENT_TYPE_MISMATCH`). The token can still be used.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/v1/files/{file_id}:
    get:
      tags:
        - Files
      summary: Get a file by ID
      description: Returns the data and metadata of a specific file
      operationId: getFile
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: files:GetFile
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
            example: 'abc123'
      responses:
        '200':
          description: File found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Files
      summary: Delete a file
      description: Removes a file from the system by ID
      operationId: deleteFile
      x-raises:
        - FILE_HAS_DEPENDENTS
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: files:DeleteFile
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: ID of the file to delete
          schema:
            type: string
            example: 'abc123'
      responses:
        '204':
          description: File deleted successfully
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            FILE_HAS_DEPENDENTS — another record still references the file.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/files/{file_id}/download:
    get:
      tags:
        - Files
      summary: Download a file
      description: Streams the file content to the client
      operationId: downloadFile
      x-raises:
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: files:DownloadFile
      x-iam-resource-type: file
      # Not a tool: a tool result is a JSON value, and this route's is a stream
      # of raw bytes. Advertising it would offer callers — MCP clients and
      # agents alike — an action that can only ever fail, and spend a tool slot
      # and its schema tokens doing so. `downloadFileBase64` is the callable
      # form and returns the same content.
      x-soat-mcp-exclude: true
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: >-
            Signed single-file download token, an alternative to a bearer
            credential (issued for ingestion-rule converters).
          schema:
            type: string
            example: 'file_abc123'
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/v1/files/{file_id}/metadata:
    patch:
      tags:
        - Files
      summary: Update file metadata
      description: Updates the metadata field of a file
      operationId: updateFileMetadata
      x-raises:
        - FILE_HAS_DEPENDENTS
        - FORBIDDEN
        - NAME_CONFLICT
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: files:UpdateFileMetadata
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
            example: 'file_abc123'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                metadata:
                  description: Replaces the stored bag; `null` clears it.
                  allOf:
                    - $ref: './metadata.yaml#/components/schemas/NullableMetadataBag'
                prefix:
                  type: string
                  description: New directory — moves the file. The resulting path (prefix + filename) must be unique within the project.
                  example: '/reports'
                filename:
                  type: string
                  description: New filename — renames the key's leaf and the download name.
                  example: 'renamed-file.txt'
                expires_at:
                  type: string
                  format: date-time
                  description: >-
                    Moves the deletion earlier, or sets one on a file that has
                    none; a past instant deletes the file at once. Never later,
                    never cleared. Refused with `409 FILE_HAS_DEPENDENTS` on a
                    file a document is made from.
                  example: '2026-12-01T12:00:00Z'
                delete_after:
                  description: >-
                    Makes the file single use. Never cleared. A file with no
                    `expires_at` gets the deployment's single-use lifetime.
                  allOf:
                    - $ref: '#/components/schemas/FileDeleteAfter'
      responses:
        '200':
          description: Metadata updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: A file already exists at the target path in this project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/files/{file_id}/download/base64:
    get:
      tags:
        - Files
      summary: Download file as base64
      description: Returns the file content encoded as base64
      operationId: downloadFileBase64
      x-raises:
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: files:DownloadFile
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: >-
            Signed single-file download token, an alternative to a bearer
            credential (issued for ingestion-rule converters).
          schema:
            type: string
      responses:
        '200':
          description: File content as base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                    description: Base64-encoded file content
                  filename:
                    type: string
                    description: Original filename
                  content_type:
                    type: string
                    description: MIME type of the file
                  size:
                    type: integer
                    nullable: true
                    description: File size in bytes
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/v1/files/{file_id}/tags:
    get:
      tags:
        - Files
      summary: Get file tags
      description: Returns all tags attached to the file
      operationId: getFileTags
      x-raises:
        - RESERVED_PATH
        - VALIDATION_FAILED
      x-iam-action: files:GetFile
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
      responses:
        '200':
          description: File tags
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    put:
      tags:
        - Files
      summary: Replace file tags
      description: Replaces all tags on the file with the provided tags
      operationId: replaceFileTags
      x-raises:
        - RESERVED_PATH
        - VALIDATION_FAILED
      x-iam-action: files:UpdateFileMetadata
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tags.yaml#/components/schemas/TagBag'
      responses:
        '200':
          description: Tags replaced
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    patch:
      tags:
        - Files
      summary: Merge file tags
      description: Merges provided tags into the file's existing tags (existing tags are preserved unless overridden)
      operationId: mergeFileTags
      x-raises:
        - RESERVED_PATH
        - VALIDATION_FAILED
      x-iam-action: files:UpdateFileMetadata
      x-iam-resource-type: file
      parameters:
        - name: file_id
          in: path
          required: true
          description: File ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tags.yaml#/components/schemas/TagBag'
      responses:
        '200':
          description: Tags merged
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    FileExpiresIn:
      type: integer
      minimum: 1
      description: >-
        Seconds until the file is deleted. Not with `expires_at`.
      example: 3600
    FileExpiresAt:
      type: string
      format: date-time
      description: >-
        When the file is deleted; in the future. Not with `expires_in`.
      example: '2026-12-01T12:00:00Z'
    FileDeleteAfter:
      type: string
      enum:
        - generation
      description: >-
        `generation`: the file is single use. The first generation that reads
        it claims it, another is refused with `409 FILE_CONSUMED`, and it is
        deleted when that generation completes or fails. It is never ingested
        and never a conversation turn's file. Without `expires_in` or
        `expires_at` it gets the deployment's single-use lifetime.
      example: 'generation'
    UploadFileBase64Request:
      type: object
      required:
        - content
      additionalProperties: false
      properties:
        project_id:
          x-soat-ref: projects
          type: string
          description: Public ID of the project
          example: 'proj_V1StGXR8Z5jdHi6B'
        content:
          type: string
          description: Base64-encoded file content
          example: 'SGVsbG8gV29ybGQ='
        prefix:
          type: string
          description: Directory within the project (e.g. /documents). Optional; defaults to / (root).
          example: '/documents'
        filename:
          type: string
          description: Original / download name and the key's leaf segment.
          example: 'document.txt'
        content_type:
          type: string
          description: MIME type of the file
          example: 'text/plain'
        metadata:
          $ref: './metadata.yaml#/components/schemas/MetadataBag'
        expires_in:
          $ref: '#/components/schemas/FileExpiresIn'
        expires_at:
          $ref: '#/components/schemas/FileExpiresAt'
        delete_after:
          $ref: '#/components/schemas/FileDeleteAfter'
    PresignedUrlRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          x-soat-ref: projects
          type: string
          description: >-
            Public ID of the project. Required for a credential that spans
            projects; a project-scoped key uses its own project.
          example: 'proj_V1StGXR8Z5jdHi6B'
        prefix:
          type: string
          description: Directory within the project (e.g. /documents). Optional; defaults to / (root).
          example: '/documents'
        filename:
          type: string
          description: Original / download name and the key's leaf segment.
          example: 'report.pdf'
        content_type:
          type: string
          description: >-
            Content type the upload must declare; an upload of another type is
            refused with `415 UPLOAD_CONTENT_TYPE_MISMATCH`. Omitted, any type
            is accepted.
          example: 'application/pdf'
        max_bytes:
          type: integer
          minimum: 1
          description: >-
            Largest upload the token accepts, in bytes. Defaults to, and may
            not exceed, the deployment's upload ceiling
            (`FILE_UPLOAD_MAX_BYTES`).
          example: 104857600
        expires_in:
          description: >-
            Seconds the uploaded file lives, counted from the upload. Not with
            `expires_at`.
          allOf:
            - $ref: '#/components/schemas/FileExpiresIn'
        expires_at:
          $ref: '#/components/schemas/FileExpiresAt'
        delete_after:
          $ref: '#/components/schemas/FileDeleteAfter'
    PresignedUrlResponse:
      type: object
      properties:
        upload_token:
          type: string
          description: Single-use token value
          example: 'upt_V1StGXR8Z5jdHi6B'
        upload_url:
          type: string
          description: >-
            URL to upload the file to. Built from the deployment's
            `FILES_UPLOAD_URL_TEMPLATE` when it sets one; otherwise this
            server's own route, absolute when `SOAT_BASE_URL` is configured
            and relative otherwise.
          example: 'https://api.example.com/api/v1/files/upload/upt_V1StGXR8Z5jdHi6B'
        max_bytes:
          type: integer
          description: Largest upload the token accepts, in bytes
          example: 104857600
        content_type:
          type: string
          description: Content type the upload must declare, when the token fixes one
          example: 'application/pdf'
        expires_at:
          type: string
          format: date-time
          description: Token expiration timestamp
    UploadFileWithTokenRequest:
      type: object
      additionalProperties: false
      properties:
        content:
          type: string
          description: Base64-encoded file content (alternative to multipart `file`)
          example: 'SGVsbG8gV29ybGQ='
        filename:
          type: string
          description: Original / download name (overrides the token's filename)
          example: 'document.txt'
        content_type:
          type: string
          description: MIME type of the file (overrides the token's content type)
          example: 'text/plain'
        metadata:
          $ref: './metadata.yaml#/components/schemas/MetadataBag'
    FileRecord:
      type: object
      description: Stored file metadata
      properties:
        id:
          type: string
          description: Unique file identifier
          example: 'abc123'
        project_id:
          x-soat-ref: projects
          type: string
          description: >-
            Project the file belongs to. Present on `getFile` and on file
            events; absent on the other operations' records.
          example: 'proj_V1StGXR8Z5jdHi6B'
        prefix:
          type: string
          readOnly: true
          description: Directory of the file (the `path` without its last segment). Read-only — set it via `prefix` on write.
          example: '/images'
        filename:
          type: string
          description: Original / download name and the key's leaf segment.
          example: 'logo.png'
        path:
          type: string
          nullable: true
          readOnly: true
          description: Full key of the file within the project — `prefix` + `/` + `filename` (e.g. /images/logo.png). Read-only; unique per project; the file's identity and policy-SRN target.
          example: '/images/logo.png'
        content_type:
          type: string
          nullable: true
          description: MIME type of the file
          example: 'application/pdf'
        size:
          type: integer
          nullable: true
          description: File size in bytes
          example: 1024
        metadata:
          $ref: './metadata.yaml#/components/schemas/MetadataBag'
        tags:
          $ref: './tags.yaml#/components/schemas/TagBag'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the file is deleted; `null` never. Past it, every read
            answers `404`.
          example: '2026-12-01T12:00:00Z'
        delete_after:
          type: string
          nullable: true
          enum:
            - generation
            - null
          description: >-
            `generation`: single use, deleted when the generation that reads
            it settles. `null` otherwise.
          example: 'generation'
        consumed_by_generation_id:
          x-soat-ref: generations
          type: string
          nullable: true
          readOnly: true
          description: The generation that claimed a single-use file; `null` until one does.
          example: 'gen_V1StGXR8Z5jdHi6B'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
