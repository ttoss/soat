openapi: 3.0.3
info:
  title: SOAT Memories API
  version: 1.0.0
  description: API for managing individual memories within a memory store
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Memories
    description: Manage individual memories (the knowledge items stored in a memory store)
security:
  - bearerAuth: []
paths:
  /api/v1/memories:
    get:
      tags:
        - Memories
      summary: List memories
      description: Returns all memories in a memory store
      operationId: listMemories
      x-iam-action: memories:ListMemories
      parameters:
        - name: memory_store_id
          in: query
          required: true
          description: Memory store to list memories from (mstore_...)
          schema:
            type: string
            example: mstore_V1StGXR8Z5jdHi6B
        - $ref: './tags.yaml#/components/parameters/TagsQuery'
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            default: 0
        - name: include_invalidated
          in: query
          required: false
          description: Include invalidated (superseded) memories. They are excluded by default; set this to audit the supersede history.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of memories
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total
                  - limit
                  - offset
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Memory'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store not found
        '500':
          description: Internal server error
    post:
      tags:
        - Memories
      summary: Create a memory
      description: >-
        Creates a new memory in the specified memory store. Automatically
        generates an embedding for semantic search, and skips the write when an
        existing memory is a near-duplicate (see `duplicate_threshold`). A merely
        similar fact is stored as its own memory: this path has no agent context
        and therefore no model to consolidate two facts into one.
      operationId: createMemory
      x-iam-action: memories:CreateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memory_store_id
                - content
              properties:
                memory_store_id:
                  x-soat-ref: memory-stores
                  type: string
                  description: Memory store to add the memory to (mstore_...)
                  example: mstore_V1StGXR8Z5jdHi6B
                content:
                  type: string
                  description: The text content of the memory
                  example: The customer prefers email communication over phone calls
                source_type:
                  type: string
                  enum: [manual, conversation]
                  description: >-
                    Whether there is a source to point at. `conversation`
                    requires `source_id`; `manual` rejects it.
                  default: manual
                  example: manual
                source_id:
                  type: string
                  description: >-
                    The conversation this fact was learned in. Required when
                    `source_type` is `conversation`, and rejected otherwise.
                  example: conv_V1StGXR8Z5jdHi6B
                tags:
                  description: >-
                    Per-memory key-value tags, used for memory-granularity
                    filtering by `tags` in search-knowledge.
                  allOf:
                    - $ref: './tags.yaml#/components/schemas/TagBag'
                metadata:
                  type: object
                  additionalProperties: true
                  description: Arbitrary structured metadata attached to the memory
                  example: { evidence: high, quarter: Q3 }
                duplicate_threshold:
                  type: number
                  description: Cosine similarity score at or above which the incoming content is considered a duplicate of an existing memory and skipped (default 0.95). Below it the memory is always created.
                  default: 0.95
                  minimum: 0
                  maximum: 1
      responses:
        '200':
          description: Memory deduplicated (action is "skipped")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryWriteResult'
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryWriteResult'
        '400':
          description: Bad request (missing required fields)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store not found
        '409':
          description: >-
            The project's `storage_bytes` quota is exceeded
            (`QUOTA_STORAGE_EXCEEDED`). Delete stored content, or raise the
            quota — no window reset clears a stored total, so no `Retry-After`
            is sent.
        '500':
          description: Internal server error
  /api/v1/memories/{memory_id}:
    get:
      tags:
        - Memories
      summary: Get a memory
      description: Returns a single memory by ID
      operationId: getMemory
      x-iam-action: memories:GetMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            example: mem_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: Memory found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store or memory not found
        '500':
          description: Internal server error
    put:
      tags:
        - Memories
      summary: Update a memory
      description: Updates an existing memory. Regenerates the embedding if content changes.
      operationId: updateMemory
      x-iam-action: memories:UpdateMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            example: mem_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Updated text content
                tags:
                  description: >-
                    Replaces the memory's tags. Pass null or an empty object to
                    clear.
                  allOf:
                    - $ref: './tags.yaml#/components/schemas/NullableTagBag'
                metadata:
                  type: object
                  nullable: true
                  additionalProperties: true
                  description: Replaces the memory's metadata. Pass null to clear.
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store or memory not found
        '500':
          description: Internal server error
    delete:
      tags:
        - Memories
      summary: Delete a memory
      description: Deletes a memory
      operationId: deleteMemory
      x-iam-action: memories:DeleteMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            example: mem_V1StGXR8Z5jdHi6B
      responses:
        '204':
          description: Memory deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store or memory not found
        '500':
          description: Internal server error
  /api/v1/memories/{memory_id}/tags:
    get:
      tags:
        - Memories
      summary: Get memory tags
      description: Returns all tags attached to the memory
      operationId: getMemoryTags
      x-iam-action: memories:GetMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          description: Memory ID
          schema:
            type: string
            example: mem_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: Memory tags
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store or memory not found
    put:
      tags:
        - Memories
      summary: Replace memory tags
      description: Replaces all tags on the memory with the provided tags (not merged)
      operationId: replaceMemoryTags
      x-iam-action: memories:UpdateMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          description: Memory ID
          schema:
            type: string
            example: mem_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tags.yaml#/components/schemas/TagBag'
      responses:
        '200':
          description: Tags replaced
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          description: Body is not an object of string values
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store or memory not found
    patch:
      tags:
        - Memories
      summary: Merge memory tags
      description: Merges provided tags into the memory's existing tags (existing tags are preserved unless overridden)
      operationId: mergeMemoryTags
      x-iam-action: memories:UpdateMemory
      parameters:
        - name: memory_id
          in: path
          required: true
          description: Memory ID
          schema:
            type: string
            example: mem_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tags.yaml#/components/schemas/TagBag'
      responses:
        '200':
          description: Tags merged
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          description: Body is not an object of string values
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Memory store or memory not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Memory:
      type: object
      properties:
        id:
          type: string
          example: mem_V1StGXR8Z5jdHi6B
        memory_store_id:
          x-soat-ref: memory-stores
          type: string
          example: mstore_V1StGXR8Z5jdHi6B
        content:
          type: string
          example: The customer prefers email communication over phone calls
        source_type:
          type: string
          enum: [manual, conversation]
          description: >-
            Whether there is a source to point at. `conversation` means
            `source_id` names the conversation this fact was learned in;
            `manual` means there is nothing to point at — a direct API write,
            or an agent write made outside a conversation.
          example: manual
        source_id:
          type: string
          nullable: true
          description: >-
            The conversation this fact was learned in, when `source_type` is
            `conversation`; null when it is `manual`. Deliberately a loose
            pointer rather than a foreign key, so deleting the conversation
            leaves the id in place — the record of where the fact came from
            outlives its source.
          example: conv_V1StGXR8Z5jdHi6B
        tags:
          description: >-
            Per-memory key-value tags, matched at memory granularity by
            knowledge search.
          allOf:
            - $ref: './tags.yaml#/components/schemas/NullableTagBag'
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Arbitrary structured metadata attached to the memory
          example: { evidence: high }
        invalidated_at:
          type: string
          format: date-time
          nullable: true
          description: When the memory was superseded. Null means the memory is currently valid. Invalidated memories are excluded from listing, from write deduplication, and from knowledge search, but remain readable by ID for audit.
        superseded_by_memory_id:
          type: string
          nullable: true
          description: The memory that replaced this one, when it was superseded. Null for valid memories.
          example: mem_V1StGXR8Z5jdHi6B
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MemoryWriteResult:
      allOf:
        - $ref: '#/components/schemas/Memory'
        - type: object
          properties:
            action:
              type: string
              enum: [created, updated, skipped, superseded]
              description: >-
                The outcome of the write operation. `updated` means an existing
                memory was rewritten to absorb the incoming fact — it is produced
                only by the LLM consolidation on agent write paths (the
                `write_memory` tool and automatic extraction), never by this
                endpoint, which creates instead of merging. `superseded` means
                the incoming content contradicted an existing memory, which was
                invalidated and replaced — it is produced by the LLM-arbitrated
                write path and does not occur until that ships.
