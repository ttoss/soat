openapi: 3.0.3
info:
  title: SOAT IAM API
  version: 1.0.0
  description: >-
    Ask the policy engine whether the calling credential may perform an
    action, built-in or one a deployment registered, and issue short-lived tokens that hold an
    API key to a narrower policy.
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: IAM
    description: Evaluate the calling credential's policies
security:
  - bearerAuth: []
paths:
  /api/v1/iam/check:
    post:
      tags:
        - IAM
      summary: Check a permission of the calling credential
      description: >-
        Evaluates the calling credential's own policies (its owner's and, for
        an API key or OAuth token, its boundary and project scope) for an
        action the deployment registered (`IAM_REGISTRATIONS_CONFIG`) or any
        built-in action, such as one a resource the deployment stores will
        perform later, on an SRN, with the engine the runtime's own routes use. A denial is `200`
        with `allowed: false`, never `403`. Only policies are evaluated: the
        answer says nothing about whether the resource exists.
      operationId: checkIamPermission
      x-raises:
        - UNAUTHORIZED
        - VALIDATION_FAILED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamCheckRequest'
      responses:
        '200':
          description: The policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IamCheckResult'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/v1/iam/tokens:
    post:
      tags:
        - IAM
      summary: Issue an IAM token
      description: >-
        Issues a short-lived token that acts as the calling API key held to a
        bound: `policy`, an inline policy document, or `policy_ids`, policies of
        the key's project or global ones. Every request on the token is
        authorized against the key's grant as it stands at that request ∩ the
        bound, so an `Allow` beyond the key grants nothing and a permission
        removed from the key leaves the token too. Work the token starts (a
        generation, a session turn, a task dispatch, an orchestration run, a
        playbook version) keeps the bound after the token expires. Only an
        API key scoped to a project issues one (`403
        IAM_TOKEN_ISSUER_NOT_ALLOWED`); a token creates neither tokens nor API
        keys. The audit log records the token's `jti` and `principal` under
        `detail.iam_token` on every entry the token makes.
      operationId: createIamToken
      x-raises:
        - FORBIDDEN
        - IAM_TOKEN_ISSUER_NOT_ALLOWED
        - IAM_TOKEN_POLICY_INVALID
        - INVALID_TOOL_CONTEXT_KEY
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: iam:CreateToken
      x-iam-resource-type: iam_token
      x-soat-agent-exclude: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamTokenRequest'
      responses:
        '201':
          description: The token and when it expires
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IamToken'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/iam/principal-revocations:
    post:
      tags:
        - IAM
      summary: Revoke a principal
      description: >-
        Revokes, for good, a `principal` the caller's IAM tokens or
        `On-Behalf-Of` assertions act for in the project. Work started for it
        (a generation, a session turn, a task dispatch, an orchestration run,
        a trigger firing) resolves no caller from then on: its next step,
        a resume included, fails `WORK_AUTHORITY_MISSING`. Revoking a principal
        already revoked is `204` too.
      operationId: revokeIamPrincipal
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: iam:RevokePrincipal
      x-iam-resource-type: iam_principal
      x-soat-agent-exclude: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IamPrincipalRevocationRequest'
      responses:
        '204':
          description: The principal is revoked
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    IamCheckRequest:
      type: object
      required:
        - action
        - resource
      additionalProperties: false
      properties:
        action:
          type: string
          description: >-
            A `module:Operation` action the deployment registered, a built-in
            one (`agents:DeleteAgent`) or a project group action
            (`project-groups:CreateApiKey`); an unknown action or a wildcard is `400`.
          example: channels:GetChannel
        resource:
          type: string
          description: >-
            `srn:<project_id>:<resource_type>:<id>`, where the type is one the
            action's module registered, or for a built-in action one its
            module's routes check it on, and `<id>` may be `*` for an action on
            no single resource (a create or a list). A `projects:*` action is
            checked on the whole project, `srn:<project_id>:*:*`, which takes
            no `context.tags`. A project group action is checked on its project group's SRN
            alone, `srn:project-group:<project_group_id>:<resource_type>/<id|*>` or the whole
            project group `srn:project-group:<project_group_id>:*`, which takes no `context.tags`.
          example: srn:proj_V1StGXR8Z5jdHi6B:channel:ch_1
        context:
          type: object
          description: What the conditions of a policy statement read.
          additionalProperties: false
          properties:
            tags:
              description: >-
                The resource's tags, read by `iam:ResourceTag/<key>`
                conditions.
              allOf:
                - $ref: './tags.yaml#/components/schemas/TagBag'
    IamCheckResult:
      type: object
      required:
        - allowed
      properties:
        allowed:
          type: boolean
          description: Whether the caller's policies allow the action.
    IamTokenRequest:
      type: object
      additionalProperties: false
      description: >-
        Exactly one of `policy` and `policy_ids`; neither or both is `400
        VALIDATION_FAILED`. `principal` is who the caller issues the token for,
        recorded in the audit log; it grants nothing.
      properties:
        project_id:
          type: string
          description: >-
            The project the token acts in. Required from a project group key, a project
            of its project group; a project key may name only its own project.
          example: proj_V1StGXR8Z5jdHi6B
        policy:
          type: object
          description: >-
            An inline policy document, validated as `POST /api/v1/policies`
            validates one (`400 IAM_TOKEN_POLICY_INVALID` otherwise). Work the
            token starts holds this snapshot.
          additionalProperties: false
          required:
            - statement
          properties:
            statement:
              type: array
              description: The policy statements.
              items:
                type: object
                description: A statement, as a policy document's.
          example:
            statement:
              - effect: Allow
                action: ['agents:CreateAgentGeneration']
        policy_ids:
          type: array
          x-soat-ref: policies
          description: >-
            Policies of the key's project or global ones, read as they stand at
            each request. An unknown id is `400 IAM_TOKEN_POLICY_INVALID`.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6B']
        principal:
          $ref: '#/components/schemas/IamPrincipal'
        tool_context:
          type: object
          additionalProperties:
            type: string
          description: >-
            A `tool_context` layer the token pins: on every tool call the token
            makes, and every call its work starts (generations, nested
            `builtin` calls, `call-tool` relays), a caller key the layer names
            is dropped in any casing and the layer's value is sent
            instead. Admission sees the caller's own bag. Keys follow the
            `tool_context` key grammar and may not be a server identity key
            (`INVALID_TOOL_CONTEXT_KEY`). A key under the deployment's reserved
            prefix (`SOAT_RESERVED_TOOL_CONTEXT_PREFIX`) needs
            `iam:PinReservedToolContext` on `srn:<project_id>:iam_token:*`,
            else `400 INVALID_TOOL_CONTEXT_KEY`.
          example:
            tenant_id: acct_42
        ttl_seconds:
          type: integer
          minimum: 30
          maximum: 900
          default: 300
          description: Seconds until the token expires.
    IamPrincipal:
      type: object
      description: >-
        A principal of the caller's own, opaque to the runtime.
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own kind of principal.
          example: service
        id:
          type: string
          minLength: 1
          maxLength: 255
          description: The caller's own id for it.
          example: billing-sync
    IamPrincipalRevocationRequest:
      type: object
      additionalProperties: false
      required:
        - principal
      properties:
        project_id:
          type: string
          description: >-
            The project to revoke it in; defaults to the calling credential's
            project.
          example: proj_V1StGXR8Z5jdHi6B
        principal:
          $ref: '#/components/schemas/IamPrincipal'
    IamToken:
      type: object
      required:
        - token
        - jti
        - expires_at
      properties:
        token:
          type: string
          description: >-
            Send as `Authorization: Bearer <token>`. Shown once; an expired
            token is `401`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.sig
        jti:
          type: string
          description: >-
            The token's id: `detail.iam_token.jti` on the audit entries it
            makes, and `meta.denied_by.id` of a denial its bound causes when it
            was minted with no `principal`; with one, the denial names that
            principal.
          example: 3f2c1a9e-7b4d-4e8a-9c1f-2d5e6a7b8c9d
        expires_at:
          type: string
          format: date-time
          description: When the token expires.
          example: '2024-01-01T00:05:00.000Z'
