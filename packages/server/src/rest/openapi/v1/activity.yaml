openapi: 3.0.3
info:
  title: SOAT Activity API
  version: 1.0.0
  description: >-
    API for the activity feed — "what did agents do today," one entry per
    autonomously executed action. Distinct from the audit log: the audit log is
    principal-centric (who did what to the platform); this feed is
    agent/run-centric (what an agent did during a run). There is no public
    create endpoint — entries are platform-written by producers (approval
    resolution, exception filing, schedule firing, tool execution). Cursor
    (keyset) paginated, not offset, because the feed is append-only and
    high-volume.
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Activity
    description: Read the autonomous-execution activity feed
security:
  - bearerAuth: []
paths:
  /api/v1/activity:
    get:
      tags:
        - Activity
      summary: List activity feed entries
      description: >-
        Returns activity entries for a project, newest first, filterable by
        kind, severity, agent, generation and orchestration run — every filter
        composable with the rest. Paginated with an opaque cursor rather than
        offset/limit — pass the previous page's `next_cursor` to fetch the
        next one; a `null` `next_cursor` means there is no more data.
      operationId: listActivity
      parameters:
        - name: project_id
          in: query
          description: Project ID (required if not using project key auth)
          schema:
            type: string
            example: proj_V1StGXR8Z5jdHi6B
        - name: kind
          in: query
          description: Filter by activity kind
          schema:
            type: string
            enum:
              [
                action_executed,
                approval_created,
                approval_resolved,
                exception_created,
                schedule_fired,
                tool_resolution_failed,
              ]
        - name: severity
          in: query
          description: Filter by severity
          schema:
            type: string
            enum: [info, warning, critical]
        - name: agent_id
          in: query
          description: >-
            Filter to entries produced by one agent. Composable with every
            other filter — entries carry one agent, one generation and one run,
            so naming two narrows to the rows where both hold.
          schema:
            type: string
            example: agent_V1StGXR8Z5jdHi6B
        - name: generation_id
          in: query
          description: >-
            Filter to entries produced during one agent generation. This is
            what turns `tool_resolution_failed` from alertable into usable: the
            warning for a suspect turn is one query rather than a scan of the
            project's feed.
          schema:
            type: string
            example: gen_V1StGXR8Z5jdHi6B
        - name: orchestration_run_id
          in: query
          description: Filter to entries produced during one orchestration run.
          schema:
            type: string
            example: orch_run_V1StGXR8Z5jdHi
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `next_cursor`
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Page of activity entries
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - next_cursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEntry'
                  next_cursor:
                    type: string
                    nullable: true
                    description: Pass as `cursor` to fetch the next page; `null` when this is the last page
        '400':
          description: Malformed cursor
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    ActivityEntry:
      type: object
      properties:
        id:
          type: string
          example: acte_V1StGXR8Z5jdHi6B
        project_id:
          x-soat-ref: projects
          type: string
        kind:
          type: string
          enum:
            [
              action_executed,
              approval_created,
              approval_resolved,
              exception_created,
              schedule_fired,
              tool_resolution_failed,
            ]
          description: >-
            How the entry was produced. `tool_resolution_failed` means a tool
            binding contributed no tool to the turn — its source could not be
            reached or refused the listing, or the listing was read and left
            nothing to attach — so the turn ran without it. The generation
            itself completes, carrying no error, so this is the only signal
            that it answered with fewer tools than it was configured to have.
        severity:
          type: string
          enum: [info, warning, critical]
        summary:
          type: string
          description: One-line, human-readable description
        detail:
          type: object
          nullable: true
          description: >-
            Kind-specific structured context (tool, args digest, node id,
            guardrail policy version)
        orchestration_run_id:
          type: string
          nullable: true
          description: Originating orchestration run, if any
        agent_id:
          type: string
          nullable: true
          description: Associated agent, if any
        generation_id:
          type: string
          nullable: true
          description: >-
            The agent generation the entry was produced during, if any. Filter
            on it with the `generation_id` query parameter to read everything
            one turn did.
        ref_id:
          type: string
          nullable: true
          description: >-
            Producer-specific reference (the approval, exception, or trigger
            firing id the entry came from, or the executed tool's id)
        created_at:
          type: string
          format: date-time
