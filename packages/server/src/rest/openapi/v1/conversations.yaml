openapi: 3.0.3
info:
  title: SOAT Conversations API
  version: 1.0.0
  description: API for managing conversations and their messages
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Conversations
    description: Manage conversations
security:
  - bearerAuth: []
paths:
  /api/v1/conversations:
    get:
      tags:
        - Conversations
      summary: List conversations
      description: Returns all conversations the caller has access to. If projectId is provided, returns only conversations in that project. project keys are scoped to a single project automatically.
      operationId: listConversations
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - INVALID_CURSOR
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:ListConversations
      x-iam-resource-type: conversation
      parameters:
        - name: project_id
          in: query
          required: false
          description: Project ID (optional)
          schema:
            type: string
            example: 'proj_V1StGXR8Z5jdHi6B'
        - name: actor_id
          in: query
          required: false
          description: Only conversations owned by this actor (their `actor_id`); message authorship does not match.
          schema:
            type: string
            example: 'actor_V1StGXR8Z5jdHi6B'
        - $ref: './tags.yaml#/components/parameters/TagsQuery'
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConversationRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      tags:
        - Conversations
      summary: Create a conversation
      description: Creates a new conversation. project keys automatically infer the project from the key's scope; JWT callers must supply projectId.
      operationId: createConversation
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:CreateConversation
      x-iam-resource-type: conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                project_id:
                  x-soat-ref: projects
                  type: string
                  description: Project ID. Required for JWT auth; omit when using an project key.
                  example: 'proj_V1StGXR8Z5jdHi6B'
                status:
                  type: string
                  enum: [open, closed]
                  default: open
                  description: Initial conversation status
                name:
                  type: string
                  nullable: true
                  description: Optional name for the conversation
                actor_id:
                  x-soat-ref: actors
                  type: string
                  nullable: true
                  description: Actor ID to associate with this conversation
                  example: 'actor_V1StGXR8Z5jdHi6B'
                retrieval:
                  type: string
                  enum: [embed, none, null]
                  nullable: true
                  description: Whether this conversation's turns are embedded for vector retrieval. Turns are stored and chunked either way, so `none` leaves them readable and reachable by full-text search without paying for an embedding. `null` (the default) inherits the project's `default_conversation_retrieval`.
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecord'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/conversations/{conversation_id}:
    get:
      tags:
        - Conversations
      summary: Get a conversation by ID
      description: Returns a conversation by its ID
      operationId: getConversation
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: conversations:GetConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      responses:
        '200':
          description: Conversation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    patch:
      tags:
        - Conversations
      summary: Update a conversation
      description: Updates the status of a conversation
      operationId: updateConversation
      x-raises:
        - AI_PROVIDER_MISCONFIGURED
        - EMBEDDING_NOT_CONFIGURED
        - FORBIDDEN
        - INTERNAL_ERROR
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:UpdateConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [open, closed]
                  description: New conversation status
                name:
                  type: string
                  nullable: true
                  description: New conversation name
                retrieval:
                  type: string
                  enum: [embed, none, null]
                  nullable: true
                  description: >-
                    Whether this conversation's turns are embedded for vector retrieval. Turns are stored and chunked either way, so `none` leaves them readable and reachable by full-text search without paying for an embedding. `null` (the default) inherits the project's `default_conversation_retrieval`. Switching it on embeds the turns already in the
                    conversation, so the whole conversation becomes retrievable
                    rather than only what is said next.
      responses:
        '200':
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationRecord'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    delete:
      tags:
        - Conversations
      summary: Delete a conversation
      description: Deletes a conversation by its ID
      operationId: deleteConversation
      x-raises:
        - FILE_HAS_DEPENDENTS
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
        - VERSION_CONFLICT
      x-iam-action: conversations:DeleteConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      responses:
        '204':
          description: Conversation deleted
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/conversations/{conversation_id}/messages:
    get:
      tags:
        - Conversations
      summary: List conversation messages
      description: Returns all messages (documents) attached to a conversation, ordered by position
      operationId: listConversationMessages
      x-raises:
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - INVALID_CURSOR
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:GetConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
        - name: order
          in: query
          required: false
          description: Sort direction by position; `desc` reads the transcript from its end.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConversationMessageRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      tags:
        - Conversations
      summary: Add a message to a conversation
      description: Creates a document from the message text and attaches it to the conversation at the given position. If position is omitted, it is appended at the end.
      operationId: addConversationMessage
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_MISCONFIGURED
        - AI_PROVIDER_NOT_FOUND
        - CONVERSATION_POSITION_CONFLICT
        - EMBEDDING_NOT_CONFIGURED
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - IDEMPOTENCY_KEY_REUSED
        - INTERNAL_ERROR
        - NAME_CONFLICT
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
        - VERSION_CONFLICT
        - WORK_AUTHORITY_MISSING
      x-iam-action: conversations:UpdateConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - role
              additionalProperties: false
              properties:
                message:
                  type: string
                  description: Message text content to add to the conversation
                  example: 'Hello, how can I help you?'
                role:
                  type: string
                  # No `system`: stored history feeds generations, so a system
                  # entry here would be a prompt injection.
                  enum: [user, assistant]
                  description: Role of the message sender
                  example: 'user'
                actor_id:
                  x-soat-ref: actors
                  type: string
                  nullable: true
                  description: Optional actor ID to associate with this message (user identity)
                  example: 'actor_V1StGXR8Z5jdHi6B'
                position:
                  type: integer
                  description: Zero-based position. Defaults to MAX+1 (append).
                  example: 0
                metadata:
                  description: >-
                    Caller-owned annotations on the message (e.g. a phone
                    number, a channel), stored as sent and returned verbatim.
                    The platform does not read the bag, so nothing in it
                    reaches the model: a value the model should see belongs in
                    `message`.
                  example:
                    phone: '5511999998888'
                    channel: 'whatsapp'
                  allOf:
                    - $ref: './metadata.yaml#/components/schemas/NullableMetadataBag'
                file_ids:
                  type: array
                  items:
                    x-soat-ref: files
                    type: string
                  description: >-
                    Files a `user` turn sends the model natively, in this order, each a
                    file of the conversation's project the caller may download
                    (`files:DownloadFile`). Refused on an `assistant` turn.
      responses:
        '201':
          description: Message added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationMessageRecord'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation or actor not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            CONVERSATION_POSITION_CONFLICT — another message took the requested position first.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/conversations/{conversation_id}/generate:
    post:
      tags:
        - Conversations
      summary: Generate the next message in a conversation
      description: |
        Generates the next message using the specified actor's linked agent or chat.
        Background by default: returns `202 Accepted` with the generation's id
        once its record exists, and the reply lands as a new ConversationMessage
        when it completes — poll `GET /api/v1/generations/{generation_id}` or
        `GET /api/v1/conversations/{conversation_id}/messages` for it.
        Pass `?wait=true` to block and receive the result inline. On
        `completed`, the reply is persisted as a new ConversationMessage
        authored by that actor. On `requires_action`, nothing is persisted; the
        caller must submit tool outputs via the Agents module and re-invoke
        generate — so a flow using client tools should pass `?wait=true`.
      operationId: generateConversationMessage
      x-raises:
        - ACTOR_NOT_FOUND
        - AGENT_NOT_FOUND
        - AGENT_TOOL_NOT_OFFERED
        - AI_PROVIDER_ERROR
        - AI_PROVIDER_FUNCTIONALITY_UNSUPPORTED
        - AI_PROVIDER_MISCONFIGURED
        - AI_PROVIDER_NOT_FOUND
        - API_KEY_PROJECT_SCOPE
        - BUILTIN_ACTION_FAILED
        - CONVERSATION_POSITION_CONFLICT
        - CONVERSION_TIMEOUT
        - EMBEDDING_NOT_CONFIGURED
        - EXPRESSION_FAILED
        - FILE_CONSUMED
        - FILE_NOT_FOUND
        - FILE_PARSE_FAILED
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - GENERATION_DEADLINE_EXCEEDED
        - GENERATION_FAILED
        - GENERATION_INTERRUPTED
        - GENERATION_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - INGESTION_TIMEOUT
        - INPUT_LIMIT_EXCEEDED
        - INPUT_MODALITY_UNSUPPORTED
        - INTERNAL_ERROR
        - INVALID_TOOL_CONTEXT_KEY
        - MAX_STEPS_REACHED
        - MCP_TOOL_ERROR
        - MEDIA_PARSE_FAILED
        - MISSING_TOOL_CONTEXT_KEY
        - MODEL_NOT_OFFERED
        - MODEL_NOT_PRICED
        - MODEL_ROUTE_NOT_FOUND
        - NAME_CONFLICT
        - NO_MESSAGE_TO_ANSWER
        - OAUTH_CONNECTION_REFRESH_FAILED
        - OAUTH_CONNECTION_REQUIRED
        - OUTPUT_SCHEMA_STREAMING_UNSUPPORTED
        - OUTPUT_SCHEMA_VALIDATION_FAILED
        - PDF_PARSE_FAILED
        - PIPELINE_DEPTH_EXCEEDED
        - PIPELINE_INVALID_STEP
        - PIPELINE_STEP_FAILED
        - PROJECT_PAUSED
        - QUERY_TIMEOUT
        - QUOTA_EXCEEDED
        - QUOTA_STORAGE_EXCEEDED
        - QUOTA_UNENFORCEABLE
        - REPLAY_REFUSED
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - SECRET_NOT_FOUND
        - SHARED_AI_PROVIDER_ERROR
        - SHARE_CAP_EXCEEDED
        - TEXT_ENCODED_TOOL_CALL
        - TOOL_AUTH_FAILED
        - TOOL_CALL_FAILED
        - TOOL_CALL_NOT_SUPPORTED
        - TOOL_DISPATCH_FAILED
        - TOOL_EGRESS_BLOCKED
        - TOOL_HTTP_ERROR
        - TOOL_NOT_FOUND
        - TOOL_RESPONSE_TOO_LARGE
        - TOOL_UNREACHABLE
        - UNAUTHORIZED
        - VALIDATION_FAILED
        - VERSION_CONFLICT
        - WORK_AUTHORITY_MISSING
      x-iam-action: conversations:GenerateConversationMessage
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
        - name: wait
          in: query
          required: false
          # Pinned to `true` for tool calls; see the agents generate operation.
          x-soat-tool-forced: true
          description: When omitted or `false` (default), the generation runs in the background and `202 Accepted` is returned immediately. Pass `true` to block until the generation settles and receive the result. A tool call, `builtin` or MCP, always waits.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_id
              additionalProperties: false
              properties:
                agent_id:
                  x-soat-ref: agents
                  type: string
                  description: ID of the agent that will produce the next message.
                model:
                  type: string
                  description: Optional model override.
                stream:
                  type: boolean
                  default: false
                  # A tool call is one request and one result: it cannot hold
                  # a stream open, so the mode is hidden and the call waits.
                  x-soat-tool-unsupported: true
                  description: >-
                    When true, the response is the turn's event stream (SSE) at
                    step granularity. Implies waiting; `?wait=false` with it is
                    `400`.
                tool_context:
                  type: object
                  additionalProperties:
                    type: string
                  nullable: true
                  description: >-
                    Key-value pairs forwarded as `X-Soat-Context-<key>` headers on every
                    `http`, `mcp` and `builtin` tool call in this generation. The header
                    name is the deployment's configured context prefix
                    (`X-Soat-Context-` by default) plus the key verbatim — no
                    character is re-cased and keys are never case-converted, so
                    they round-trip
                    exactly as sent. An invalid or colliding key is rejected with
                    `400 INVALID_TOOL_CONTEXT_KEY`.
      responses:
        '200':
          description: >-
            Generation completed or requires action (only when `?wait=true`),
            or the turn's event stream (with `stream: true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateConversationMessageResponse'
            text/event-stream:
              schema:
                type: string
                description: >
                  With `stream: true`: first an `event: accepted` frame whose
                  `data` is the `202` body, then the generation's events as on
                  `GET /api/v1/generations/{generation_id}/events?stream=true`,
                  one `event: progress` frame per row, ending with
                  `data: [DONE]` when the generation settles. Step content
                  needs `traces:GetTrace` on the trace; without it the frames
                  carry the rows only (`step` is null).
        '202':
          description: Generation accepted and running in the background (default, when `wait` is omitted or `false`). The generation record already exists, so `generation_id` is pollable via `GET /api/v1/generations/{generation_id}`; the reply is persisted as a ConversationMessage when it completes.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - conversation_id
                  - generation_id
                  - trace_id
                properties:
                  status:
                    type: string
                    enum: [accepted]
                    example: accepted
                  conversation_id:
                    type: string
                    example: 'conv_V1StGXR8Z5jdHi6B'
                  generation_id:
                    type: string
                    example: 'gen_V1StGXR8Z5jdHi6B'
                  trace_id:
                    type: string
                    example: 'trace_V1StGXR8Z5jdHi6B'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation or actor not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            PROJECT_PAUSED — the project is paused, so nothing new starts in it; `error.meta` carries `paused_at` and `pause_reason`.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          description: >-
            `QUOTA_EXCEEDED`: an `enforce`-mode generation quota is exhausted.
            `error.meta` carries `quota_id`, `metric`, `limit`, `window` and
            `resets_at`, with a `Retry-After` header. Only with `?wait=true`:
            a background call is answered `202` before the quota is read.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/conversations/{conversation_id}/messages/{document_id}:
    delete:
      tags:
        - Conversations
      summary: Remove a message from a conversation
      description: Removes a document from a conversation
      operationId: removeConversationMessage
      x-raises:
        - FILE_HAS_DEPENDENTS
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
        - VERSION_CONFLICT
      x-iam-action: conversations:UpdateConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
        - name: document_id
          in: path
          required: true
          description: Document ID
          schema:
            type: string
            example: 'doc_V1StGXR8Z5jdHi6B'
      responses:
        '204':
          description: Message removed
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation or message not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/conversations/{conversation_id}/tags:
    get:
      tags:
        - Conversations
      summary: Get conversation tags
      description: Returns all tags attached to the conversation
      operationId: getConversationTags
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:GetConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      responses:
        '200':
          description: Conversation tags
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    put:
      tags:
        - Conversations
      summary: Replace conversation tags
      description: Replaces all tags on the conversation with the provided tags
      operationId: replaceConversationTags
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:UpdateConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tags.yaml#/components/schemas/TagBag'
      responses:
        '200':
          description: Tags replaced
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    patch:
      tags:
        - Conversations
      summary: Merge conversation tags
      description: Merges provided tags into the conversation's existing tags (existing tags are preserved unless overridden)
      operationId: mergeConversationTags
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: conversations:UpdateConversation
      x-iam-resource-type: conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          description: Conversation ID
          schema:
            type: string
            example: 'conv_V1StGXR8Z5jdHi6B'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './tags.yaml#/components/schemas/TagBag'
      responses:
        '200':
          description: Tags merged
          content:
            application/json:
              schema:
                $ref: './tags.yaml#/components/schemas/TagBag'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    ConversationRecord:
      type: object
      properties:
        id:
          type: string
          description: Conversation ID
          example: 'conv_V1StGXR8Z5jdHi6B'
        project_id:
          x-soat-ref: projects
          type: string
          description: Project ID
          example: 'proj_V1StGXR8Z5jdHi6B'
        name:
          type: string
          nullable: true
          description: Optional human-readable name for the conversation.
        status:
          type: string
          enum: [open, closed]
          description: Conversation status
          example: 'open'
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        actor_id:
          x-soat-ref: actors
          type: string
          nullable: true
          description: Actor ID associated with this conversation
          example: 'actor_V1StGXR8Z5jdHi6B'
        tags:
          $ref: './tags.yaml#/components/schemas/TagBag'
        retrieval:
          type: string
          enum: [embed, none, null]
          nullable: true
          description: Whether this conversation's turns are embedded for vector retrieval. Turns are stored and chunked either way, so `none` leaves them readable and reachable by full-text search without paying for an embedding. `null` (the default) inherits the project's `default_conversation_retrieval`.
    ConversationMessageRecord:
      type: object
      properties:
        document_id:
          x-soat-ref: documents
          type: string
          description: Document ID
          example: 'doc_V1StGXR8Z5jdHi6B'
        role:
          type: string
          # Wider than what writes accept: `system` is refused on write with
          # VALIDATION_FAILED.
          enum: [user, assistant, system]
          description: Role of the message sender
          example: 'user'
        actor_id:
          x-soat-ref: actors
          type: string
          nullable: true
          description: Optional actor ID associated with this message
          example: 'actor_V1StGXR8Z5jdHi6B'
        agent_id:
          x-soat-ref: agents
          type: string
          nullable: true
          description: Optional agent ID that generated this message (set for assistant messages produced by generate)
          example: 'agent_V1StGXR8Z5jdHi6B'
        position:
          type: integer
          description: Zero-based position in the conversation
          example: 0
        metadata:
          description: Optional structured metadata attached to the message
          example:
            phone: '5511999998888'
            channel: 'whatsapp'
          allOf:
            - $ref: './metadata.yaml#/components/schemas/MetadataBag'
        content:
          type: string
          nullable: true
          description: Full text content of the message
        file_ids:
          type: array
          items:
            x-soat-ref: files
            type: string
          description: Files the turn sends the model natively, in order; empty when none.
        citations:
          type: array
          nullable: true
          description: >-
            The `output.citations` of the generation that produced this
            assistant message, `quoted_text` included; `answer_span` points
            into `content`. Empty when that turn cited and none verified; null
            when no citing turn produced the message.
          items:
            $ref: './generations.yaml#/components/schemas/Citation'
        idempotency_key:
          type: string
          nullable: true
          description: >-
            The idempotency key the message was posted with, null when none
            was sent. A channel that posts each inbound message under its
            provider's message id finds the transcript row for that message by
            this key.
          example: wamid.HBgLNTUxMTk4...
    GenerateConversationMessageCompleted:
      type: object
      required: [status, content, message, generation_id, trace_id]
      properties:
        status:
          type: string
          enum: [completed]
          description: Indicates generation finished successfully.
        content:
          type: string
          description: >
            The AI-generated text of the reply. This is the canonical field
            for the assistant's response text.
          example: 'Hello! How can I help you today?'
        message:
          description: >-
            The stored assistant message, the record
            `GET /api/v1/conversations/{conversation_id}/messages` lists at its
            `position`. Its `document_id` addresses it.
          allOf:
            - $ref: '#/components/schemas/ConversationMessageRecord'
        generation_id:
          x-soat-ref: generations
          type: string
          description: ID of the underlying generation record.
          example: 'gen_V1StGXR8Z5jdHi6B'
        trace_id:
          x-soat-ref: traces
          type: string
          description: Trace ID for observability.
          example: 'trace_V1StGXR8Z5jdHi6B'
        model:
          type: string
          description: Model used for generation.
          example: 'gpt-4o'
    GenerateConversationMessageRequiresAction:
      type: object
      required: [status, generation_id, trace_id, required_action]
      properties:
        status:
          type: string
          enum: [requires_action]
          description: >
            Indicates the agent requires tool-call outputs before it can
            produce a reply. No message is persisted yet.
        generation_id:
          x-soat-ref: generations
          type: string
          description: ID of the paused generation. Pass to the tool-outputs endpoint.
          example: 'gen_V1StGXR8Z5jdHi6B'
        trace_id:
          x-soat-ref: traces
          type: string
          description: Trace ID for observability.
          example: 'trace_V1StGXR8Z5jdHi6B'
        required_action:
          type: object
          description: Tool-call information the client must resolve.
          properties:
            type:
              type: string
              enum: [submit_tool_outputs]
            tool_calls:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  tool_name:
                    type: string
                  args:
                    type: object
    GenerateConversationMessageResponse:
      oneOf:
        - $ref: '#/components/schemas/GenerateConversationMessageCompleted'
        - $ref: '#/components/schemas/GenerateConversationMessageRequiresAction'
      discriminator:
        propertyName: status
        mapping:
          completed: '#/components/schemas/GenerateConversationMessageCompleted'
          requires_action: '#/components/schemas/GenerateConversationMessageRequiresAction'
