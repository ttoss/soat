  /api/v1/tasks/{task_id}/hold:
    put:
      description: >-
        Holds a task until a future date, or clears its hold with `null`.
        While the date is ahead the task is blocked (`readiness.blocked`,
        a `scheduled` entry in `readiness.blocked_by`); once it passes the
        task is ready with no write, and `tasks.hold_cleared` fires. An
        action of its own, `tasks:SetTaskHold`; create-task and update-task
        do not accept `hold_until`.
      tags:
