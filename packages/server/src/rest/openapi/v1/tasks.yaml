components:
  parameters:
    TaskListProjectId:
      name: project_id
      in: query
      required: false
      description: >-
        Only the tasks of this project. Omitted, every project the caller
        reads.
      schema:
        type: string
    TaskStateFilter:
      name: state
      in: query
      required: false
      description: Only the tasks in this workflow state.
      schema:
        type: string
    TaskStatusFilter:
      name: status
      in: query
      required: false
      description: >-
        Filter by whether the task is open or closed. Repeat the parameter
        to OR values. A value outside the enum, empty string included, is a
        `400`.
      schema:
        type: array
        items:
          type: string
          enum: [open, closed]
      style: form
      explode: true
    TaskAutomationStatusFilter:
      name: automation_status
      in: query
      required: false
      description: >-
        Filter by the current state's dispatch status. Repeat the parameter
        to OR values. `none` selects the tasks whose `automation_status` is
        `null` — the ones that never entered a state with an automation. It
        is a value a task really holds, so it is a value of the filter too;
        the parameter's own absence already means "every task".


        A value outside the enum, empty string included, is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            - running
            - completed
            - failed
            - unrouted
            - paused
            - none
      style: form
      explode: true
      example:
        - running
    TaskPriorityFilter:
      name: priority
      in: query
      required: false
      description: >-
        Filter by priority. Repeat the parameter to OR values. `none`
        selects the tasks nobody prioritised (`priority: null`). A value
        outside the enum, empty string included, is a `400`.
      schema:
        type: array
        items:
          type: string
          enum:
            - very_high
            - high
            - medium
            - low
            - very_low
            - none
      style: form
      explode: true
      example:
        - high
    TaskAssigneeFilter:
      name: assignee
      in: query
      required: false
      description: Only the tasks assigned to this value.
      schema:
        type: string
    TaskBlockedFilter:
      name: blocked
      in: query
      required: false
      description: >-
        `true` lists only the blocked tasks (`readiness.blocked`: a hold whose
        date is ahead or an open dependency), `false` only the rest.
      schema:
        type: string
        enum: ['true', 'false']
    TaskUpstreamOf:
      name: upstream_of
      in: query
      required: false
      description: >-
        Only the tasks this task depends on, directly or through others, closed
        ones included; never the task itself. An unknown id selects nothing.
        With `blocked=false&order=next` it pulls the next task toward it.
      schema:
        type: string
        example: task_V1StGXR8Z5jdHi6B
    WorkflowPin:
      name: workflow_id
      in: query
      required: false
      description: >-
        Pins the call to the tasks of this workflow, as the listing's
        `workflow_id` filters them. A task of another workflow is `404`, as if
        it did not exist.
      schema:
        type: string
        example: wfl_V1StGXR8Z5jdHi6B
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Task:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        workflow_id:
          type: string
        workflow_version:
          type: integer
          description: >-
            The workflow version this task runs on, fixed when the task was
            created. Transitions, approval gates and payload validation all
            resolve through it, so editing the workflow never re-shapes a task
            already in flight.
          example: 1
        title:
          type: string
        state:
          type: string
        status:
          type: string
          enum:
            - open
            - closed
        payload:
          type: object
          description: >-
            Caller-owned task data; input to guards (as `task.payload`) and
            dispatch mappings. The engine never writes into it except the
            workflow's declared `payload_writes`.
        metadata:
          description: >-
            The caller-owned key/value metadata, as created or last replaced
            by an update, returned verbatim. Absent when the task was created without
            any. Unlike `payload` it is invisible to guards and to
            `payload_writes`, so it is the place for an attribution label rather
            than task data.
          example:
            tenant_account_id: '42'
            source: zendesk
          allOf:
            - $ref: './metadata.yaml#/components/schemas/MetadataBag'
        last_result:
          description: >-
            Server-owned. The result of the current state's last completed
            dispatch, overwritten on every dispatch. Read-only — exposed to
            transition guards and `on_complete`/`payload_writes` expressions as
            `task.last_result`, a namespace a caller cannot write. An `agent`
            dispatch's result is the generation's output plus `ai_provider_id`,
            the provider that served its `model` (null when the route that ran
            named no serving target).
        assignee:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
          enum:
            - very_high
            - high
            - medium
            - low
            - very_low
            - null
          description: >-
            A person's assertion of how much the task matters, never derived.
            `null` until someone sets it. Set and cleared only with
            set-task-priority; readable by guards as `task.priority`.
        hold_until:
          type: string
          format: date-time
          nullable: true
          description: >-
            The date the task is held until; blocked while it is ahead. Set
            and cleared only with set-task-hold; the scheduler clears a passed
            one and emits `tasks.hold_cleared`.
        hold_reason:
          type: string
          nullable: true
          description: Why the task is held; `null` without a hold.
        active_dispatch:
          type: object
          nullable: true
          description: >-
            { kind, id, status } of the current state's dispatch, if any. `kind`
            is `generation`, `orchestration_run` or `tool_call`; a `tool_call`
            always carries a null `id`, since a direct tool call leaves no
            addressable record. Carries an additional `attempt` (1-based) while
            the state's `on_enter.retry` policy is in effect.
        automation_status:
          type: string
          nullable: true
          enum:
            - running
            - completed
            - failed
            - unrouted
            - paused
            - null
          description: >-
            Status of the current state's dispatch. `null` until a state with an
            automation is entered. `paused` means an operator pause suppressed
            this state's `on_enter` before it ran, so resume-task will start it.
        pause_requested_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When an operator paused this task's automation, or null when no
            pause is in force.
        pause_reason:
          type: string
          nullable: true
          description: The reason supplied with the pause, when one was.
        automation_chain_depth:
          type: integer
          description: >-
            Server-owned. How many machine-driven transitions have run
            back-to-back with no outside intervention — a dispatch outcome routed
            through `on_complete`/`on_failure`, or a `transition-task` call made
            by a dispatched run or agent under its stored authority. Any move by a
            person, a plain API key, or an approval resolution resets it to `0`.
            Once it would exceed the server's limit (`TASK_AUTOMATION_CHAIN_LIMIT`,
            default 50) the next such transition is refused with
            `TASK_AUTOMATION_CHAIN_LIMIT`, bounding a cycle composed across
            workflows and orchestrations.
        pending_transition:
          type: string
          nullable: true
          description: >-
            The name of a `requires_approval` transition parked awaiting a human
            decision. Non-null while an ApprovalItem gates the move; the task
            stays in its current state and no other transition may fire until the
            approval resolves.
        readiness:
          $ref: '#/components/schemas/TaskReadiness'
        entered_state_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskTransition:
      type: object
      properties:
        id:
          type: string
        task_id:
          type: string
        from_state:
          type: string
          nullable: true
        to_state:
          type: string
        transition:
          type: string
          nullable: true
        principal_type:
          allOf:
            - $ref: './principals.yaml#/components/schemas/PrincipalType'
          description: >
            Who made the move: `user` or `api_key` for an authenticated caller,
            `automation` for the engine acting on an `on_enter` dispatch
            outcome, `approval` for an approval resolution. Named
            `principal_*`, not `actor_*`: these ids never reference the Actors
            module.
        principal_id:
          type: string
          nullable: true
          description: >
            Public id of the principal that made the move — the user
            (`user_...`), or for `api_key` auth the key's own id (`key_...`),
            distinguishing which key acted. Null for `automation`, which has no
            principal: the cause is carried by `generation_id` /
            `orchestration_run_id` / `tool_id`, one per dispatch kind — exactly
            one of which is set on an automation move.
        acts_for:
          type: object
          nullable: true
          description: >-
            The opaque principal the mover acted for: the `principal` of the
            IAM token that made the move, or the one an `On-Behalf-Of`
            assertion carried, as when a `builtin` tool's `transition-task`
            runs for a token's call. `principal_id` names the key that minted
            the token. Null when the mover named none, and on `automation` and
            `approval` moves.
          required: [type, id]
          properties:
            type:
              type: string
              example: channel
            id:
              type: string
              example: discord-dm-42
        generation_id:
          type: string
          nullable: true
          description: Set when an `agent` dispatch's generation caused the move.
        orchestration_run_id:
          type: string
          nullable: true
          description: Set when an `orchestration` dispatch's run caused the move.
        tool_id:
          type: string
          nullable: true
          description: >
            Set when a `tool` dispatch caused the move. A tool call produces no
            addressable record of its own, so the tool it called is what records
            why the task moved.
        note:
          type: string
          nullable: true
        from_workflow_version:
          type: integer
          nullable: true
          description: >-
            Set on a migration row only, the version the task left.
        to_workflow_version:
          type: integer
          nullable: true
          description: Set on a migration row only, the version the task moved onto.
        created_at:
          type: string
          format: date-time
    TaskGraph:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [nodes, edges]
          properties:
            nodes:
              type: array
              description: >-
                A summary of each task the filters select, newest first; the
                whole task is `GET /tasks/{task_id}`.
              items:
                $ref: '#/components/schemas/TaskGraphNode'
            edges:
              type: array
              description: >-
                Every dependency between two of `nodes`; one to a task the
                filters leave out is not answered.
              items:
                type: object
                required: [task_id, depends_on_task_id]
                properties:
                  task_id:
                    type: string
                    description: The task that waits.
                  depends_on_task_id:
                    type: string
                    description: The task it waits on.
                  note:
                    type: string
                    nullable: true
                    description: The note the dependency was added with.
    TaskGraphNode:
      type: object
      required: [id, title, state, status, priority, blocked]
      properties:
        id:
          type: string
          example: task_V1StGXR8Z5jdHi6B
        title:
          type: string
          description: The task's title.
        state:
          type: string
          description: Its current workflow state.
        status:
          type: string
          enum: [open, closed]
          description: Whether the task is open or closed.
        priority:
          type: string
          nullable: true
          enum: [very_high, high, medium, low, very_low, null]
          description: The priority a person set; `null` when nobody did.
        blocked:
          type: boolean
          description: Whether an open dependency holds it (`readiness.blocked`).
        metadata:
          description: The caller-owned metadata the task carries.
          allOf:
            - $ref: './metadata.yaml#/components/schemas/MetadataBag'
    TaskReadiness:
      type: object
      description: >-
        Computed on every read. A hold whose date is ahead and each open
        dependency block; any close, `cancelled` included, frees what the task
        held. Guards read it as `task.readiness`.
      required:
        - blocked
        - blocked_by
        - blocked_by_count
        - unblocks
      properties:
        blocked:
          type: boolean
          description: Whether a hold or any dependency still blocks the task.
        blocked_by:
          type: array
          description: >-
            What blocks the task: its hold first, then the open dependencies,
            oldest first, at most 20.
          items:
            oneOf:
              - $ref: '#/components/schemas/TaskScheduledBlocker'
              - $ref: '#/components/schemas/TaskDependencyBlocker'
            discriminator:
              propertyName: kind
              mapping:
                scheduled: '#/components/schemas/TaskScheduledBlocker'
                task: '#/components/schemas/TaskDependencyBlocker'
        blocked_by_count:
          type: integer
          description: >-
            How many blockers there are, the hold included, counting any
            dependency beyond the 20 listed.
        unblocks:
          type: integer
          description: How many open tasks depend on this one.
    TaskScheduledBlocker:
      type: object
      description: The task's hold, while its date is ahead.
      required:
        - kind
        - until
        - reason
      properties:
        kind:
          type: string
          enum:
            - scheduled
        until:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
    TaskDependencyBlocker:
      type: object
      description: An open dependency.
      required:
        - kind
        - task_id
        - title
        - state
      properties:
        kind:
          type: string
          enum:
            - task
        task_id:
          type: string
        title:
          type: string
        state:
          type: string
    TaskDependencyEnd:
      type: object
      required:
        - id
        - title
        - state
        - status
      properties:
        id:
          type: string
        title:
          type: string
        state:
          type: string
        status:
          type: string
          enum:
            - open
            - closed
    TaskDependency:
      type: object
      description: >-
        `depends_on_task` blocks `task` until it closes. The pair is its
        identity.
      properties:
        task:
          $ref: '#/components/schemas/TaskDependencyEnd'
        depends_on_task:
          $ref: '#/components/schemas/TaskDependencyEnd'
        note:
          type: string
          nullable: true
        created_by_principal_type:
          allOf:
            - $ref: './principals.yaml#/components/schemas/PrincipalType'
          description: Who added the dependency.
        created_by_principal_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    AddTaskDependencyRequest:
      type: object
      additionalProperties: false
      required:
        - depends_on_task_id
      properties:
        depends_on_task_id:
          type: string
          description: The task that blocks this one, in the same project.
        note:
          type: string
          nullable: true
          description: Why the task waits, returned as written.
    TaskTransitionOption:
      type: object
      required:
        - name
        - to
        - requires_approval
        - allowed
        - error_code
      properties:
        name:
          type: string
        to:
          type: string
          description: The state the transition moves the task to.
        requires_approval:
          type: boolean
          description: Firing it parks an approval instead of moving the task.
        allowed:
          type: boolean
          description: Whether firing it now as the caller would be accepted.
        error_code:
          type: string
          nullable: true
          enum:
            - TASK_TRANSITION_CONFLICT
            - TASK_GUARD_REJECTED
            - null
          description: >-
            The code firing it would answer: `TASK_TRANSITION_CONFLICT` when
            the task is closed, has a transition pending approval, or is not in
            one of the transition's `from` states; `TASK_GUARD_REJECTED` when
            its guard fails. Null when `allowed`.
    CreateTaskRequest:
      type: object
      required:
        - workflow_id
        - title
      additionalProperties: false
      properties:
        project_id:
          type: string
        workflow_id:
          type: string
        title:
          type: string
        payload:
          type: object
        assignee:
          type: string
          nullable: true
        idempotency_key:
          type: string
          maxLength: 255
          description: >-
            The create's deduplication key, unique within the project and
            claimed for as long as the task it created exists. The same key
            with the same body returns that task as it is now (`200`) instead
            of creating a second one; with a different body it is
            `409 IDEMPOTENCY_KEY_REUSED`. A create that fails claims no key.
            Equivalent to the `Idempotency-Key` header.
        state:
          type: string
          description: >-
            Name of a declared workflow state to create the task in directly,
            instead of the workflow's `initial` state. Must name a state
            declared on the workflow, or the request is rejected with
            `TASK_STATE_NOT_FOUND` (400). Defaults to the `initial` state.
        tool_context:
          type: object
          additionalProperties:
            type: string
          description: >-
            Key-value pairs forwarded as `X-Soat-Context-<key>` headers on every
            `http`, `mcp` and `builtin` tool call made by this task's automation
            dispatches — the agent generations a state's `on_enter` starts, and
            the agent nodes of any orchestration run it starts. The header name
            is `X-Soat-Context-` plus the key verbatim; no character is re-cased.

            Creation is the task's first move, so this is the bag the entry
            state's `on_enter` runs with. Each transition may replace it (see
            `TransitionTaskRequest.tool_context`).

            The reserved identity keys (`session_id`, `actor_id`,
            `actor_external_id`) are stripped in any casing and re-derived
            server-side, so a task-dispatched generation cannot forge them. A key
            outside the HTTP header-name grammar is rejected with
            `INVALID_TOOL_CONTEXT_KEY` (400).

            Write-only: the stored bag is never returned by any task read, and it
            is cleared when the task reaches a terminal state.
        metadata:
          description: >-
            Caller-supplied key/value metadata attached to the task record for
            attribution — which of your own tenants the task belongs to, the
            ticket that raised it, the import batch that created it.
            Round-trips verbatim on every read of the task, the list included,
            and survives every transition (a transition supplies no metadata of
            its own). `PATCH /tasks/{task_id}` replaces it.


            The bag is caller-owned and no key is reserved: everything the
            engine decides about a task (`state`, `status`, `workflow_version`,
            `last_result`, `active_dispatch`, the automation fields) is a field
            of its own and cannot be written from here.


            Prefer this over `payload` for anything that is not task data:
            `payload` is read by every guard as `task.payload` and may be
            written by the workflow's declared `payload_writes`, so a label
            parked there is neither invisible to the state machine nor safe from
            it. A non-object is rejected with `400 VALIDATION_FAILED` and no
            task is created.
          example:
            tenant_account_id: '42'
            source: zendesk
          allOf:
            - $ref: './metadata.yaml#/components/schemas/MetadataBag'
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        payload:
          type: object
          description: >-
            Partial payload, shallow-merged over the existing payload. Omitted
            keys are preserved; provided keys overwrite. The merged result must
            satisfy the workflow's payload_schema.
        assignee:
          type: string
          nullable: true
        metadata:
          description: >-
            Caller-owned key/value metadata, replacing the stored bag; `null`
            clears it, and omitting it keeps it. Writable at any state,
            terminal included, because the bag is invisible to guards and to
            `payload_writes`. A non-object is `400 VALIDATION_FAILED` and the
            stored bag is kept.
          allOf:
            - $ref: './metadata.yaml#/components/schemas/NullableMetadataBag'
    SetTaskPriorityRequest:
      type: object
      required:
        - priority
      additionalProperties: false
      properties:
        priority:
          type: string
          nullable: true
          enum:
            - very_high
            - high
            - medium
            - low
            - very_low
            - null
          description: >-
            The priority to set; `null` clears it. A value outside the enum is
            `400 VALIDATION_FAILED`.
    SetTaskHoldRequest:
      type: object
      required:
        - hold_until
      additionalProperties: false
      properties:
        hold_until:
          type: string
          format: date-time
          nullable: true
          description: >-
            The date to hold the task until, in the future; `null` clears the
            hold. A past date is `400 VALIDATION_FAILED`.
        hold_reason:
          type: string
          nullable: true
          maxLength: 256
          description: >-
            Why the task is held, surfaced on `hold_reason` and in its
            `blocked_by` entry. Only with a `hold_until`.
    PauseTaskRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 256
          description: Why the task is being paused, surfaced on `pause_reason`.
      additionalProperties: false

    MigrateTaskRequest:
      type: object
      required:
        - to_version
      properties:
        to_version:
          type: integer
          minimum: 1
          description: The workflow version to move the task onto; newer than its current one.
        state_map:
          type: object
          additionalProperties:
            type: string
          description: >-
            Current state name to a state the target version declares. Required
            only for a state the target lacks; an entry for a state both declare
            overrides the identity mapping.
      additionalProperties: false

    TransitionTaskRequest:
      type: object
      required:
        - transition
      additionalProperties: false
      properties:
        transition:
          type: string
        note:
          type: string
          nullable: true
        payload:
          type: object
          description: >-
            Keys shallow-merged over the task's payload under the transition's
            lock, before the guard reads it, exactly as `PATCH` merges them; the
            result must satisfy the payload schema of the version the task is
            pinned to (`TASK_PAYLOAD_INVALID`). A refused move writes none of
            it. On a `requires_approval` transition the payload is held with the
            gate and merged when the approval fires the move, so a rejected or
            expired gate writes nothing.
        idempotency_key:
          type: string
          maxLength: 255
          description: >-
            The move's deduplication key, unique within the task and claimed
            for as long as the task exists. The same key with the same body
            replays the task as it is now instead of moving it again, whether
            the move applied or parked an approval; with a different body it is
            `409 IDEMPOTENCY_KEY_REUSED`. Equivalent to the `Idempotency-Key`
            header.
        tool_context:
          type: object
          additionalProperties:
            type: string
          description: >-
            Caller context for the automation dispatches the task makes from
            here on, forwarded as `X-Soat-Context-<key>` headers on their tool
            calls.

            Supplying it **replaces** the task's stored bag wholesale; omitting
            it keeps the current one, so the context follows whoever last moved
            the task and survives every move that does not speak about it —
            including an approval gate, a retry, and an automation hop. Send an
            empty object to clear it without closing the task.

            The reserved identity keys (`session_id`, `actor_id`,
            `actor_external_id`) are stripped in any casing and re-derived
            server-side. A key outside the HTTP header-name grammar is rejected
            with `INVALID_TOOL_CONTEXT_KEY` (400).

            Write-only: never returned by a task read, and cleared when the
            transition closes the task.
