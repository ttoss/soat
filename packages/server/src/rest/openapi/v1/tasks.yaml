openapi: 3.0.3
info:
  title: SOAT Tasks API
  version: 1.0.0
  description: >-
    API for managing tasks — durable, stateful work items bound to a workflow.
    A task moves between named states over time (including backward), driven by
    a mix of agents and humans, with a full, audited transition history.
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Tasks
    description: Manage tasks and their transitions
security:
  - bearerAuth: []
paths:
  /api/v1/tasks:
    get:
      description: >-
        Lists tasks (the board query). Filter by workflow, state, status,
        automation status, priority, assignee, `upstream_of` or `metadata` —
        `GET /tasks?workflow_id=...&state=...` is one board column.
      tags:
        - Tasks
      summary: List tasks
      operationId: listTasks
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - INVALID_CURSOR
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:ListTasks
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/TaskListProjectId'
        - name: workflow_id
          in: query
          required: false
          x-soat-pin:
            field: workflow_id
            match: equals
          description: >-
            Only the tasks of this workflow. Every `/tasks/{task_id}` operation
            takes the same pin, so a tool presetting it reaches no task of
            another workflow.
          schema:
            type: string
        - $ref: '#/components/parameters/TaskStateFilter'
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskAutomationStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - $ref: '#/components/parameters/TaskAssigneeFilter'
        - $ref: '#/components/parameters/TaskBlockedFilter'
        - $ref: '#/components/parameters/TaskUpstreamOf'
        - $ref: './structured-filters.yaml#/components/parameters/MetadataQuery'
        - name: order
          in: query
          required: false
          description: >-
            Omitted, newest first. `next` lists in pull order: effective
            priority (the highest `priority` of the task and of every open task
            it blocks, transitively; `null` below `very_low`), then
            `readiness.unblocks` descending, then `entered_state_at` oldest
            first, then `id`. It composes with every filter and answers one
            page: `limit` applies, a `cursor` is a `400`, and `next_cursor` is
            `null`.
          schema:
            type: string
            enum: [next]
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      description: >-
        Creates a task bound to a workflow. By default the task is placed in
        the workflow's initial state; passing `state` places it directly in
        that named state instead — an alternate entry point for starting a
        task mid-flow (e.g. "a new recorte for an existing theme by id"),
        rather than re-submitting from the initial state and hoping a guard or
        similarity gate recognizes it. Entering the resulting state, initial
        or named, behaves identically: that state's `on_enter` automation
        fires and its `stalled_after` clock arms.
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      x-raises:
        - ACTOR_NOT_FOUND
        - AGENT_NOT_FOUND
        - AGENT_TOOL_NOT_OFFERED
        - AI_PROVIDER_ERROR
        - AI_PROVIDER_MISCONFIGURED
        - AI_PROVIDER_NOT_FOUND
        - API_KEY_PROJECT_SCOPE
        - BUILTIN_ACTION_FAILED
        - CONVERSATION_POSITION_CONFLICT
        - CONVERSION_TIMEOUT
        - EMBEDDING_NOT_CONFIGURED
        - EXPRESSION_FAILED
        - FILE_CONSUMED
        - FILE_NOT_FOUND
        - FILE_PARSE_FAILED
        - FILE_STORAGE_MISCONFIGURED
        - FORBIDDEN
        - GENERATION_ALREADY_IN_PROGRESS
        - GENERATION_DEADLINE_EXCEEDED
        - GENERATION_FAILED
        - GENERATION_INTERRUPTED
        - GENERATION_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - INGESTION_TIMEOUT
        - INPUT_LIMIT_EXCEEDED
        - INPUT_MODALITY_UNSUPPORTED
        - INTERNAL_ERROR
        - INVALID_TEMPLATE_TOKEN
        - INVALID_TOOL_CONTEXT_KEY
        - LOOP_ITEM_TOOL_CONTEXT_INVALID
        - MAX_STEPS_REACHED
        - MCP_TOOL_ERROR
        - MEDIA_PARSE_FAILED
        - MISSING_TOOL_CONTEXT_KEY
        - MODEL_NOT_OFFERED
        - MODEL_NOT_PRICED
        - NAME_CONFLICT
        - NO_MESSAGE_TO_ANSWER
        - OAUTH_CONNECTION_REFRESH_FAILED
        - OAUTH_CONNECTION_REQUIRED
        - ORCHESTRATION_CYCLE_DETECTED
        - ORCHESTRATION_DISPATCH_FAILED
        - ORCHESTRATION_MAX_ITERATIONS_EXCEEDED
        - ORCHESTRATION_NODE_FAILED
        - ORCHESTRATION_NOT_FOUND
        - ORCHESTRATION_POLL_EXHAUSTED
        - ORCHESTRATION_RUN_DEPTH_LIMIT
        - ORCHESTRATION_RUN_NOT_FOUND
        - OUTPUT_SCHEMA_STREAMING_UNSUPPORTED
        - OUTPUT_SCHEMA_VALIDATION_FAILED
        - PDF_PARSE_FAILED
        - PIPELINE_DEPTH_EXCEEDED
        - PIPELINE_INVALID_STEP
        - PIPELINE_STEP_FAILED
        - PROJECT_PAUSED
        - QUERY_TIMEOUT
        - QUEUE_DRIVER_MISCONFIGURED
        - REPLAY_REFUSED
        - RESERVED_PATH
        - RESOURCE_NOT_FOUND
        - SECRET_NOT_FOUND
        - SESSION_CLOSED
        - SESSION_EXPIRED
        - SHARED_AI_PROVIDER_ERROR
        - SHARE_CAP_EXCEEDED
        - TASK_NOT_FOUND
        - TASK_PAYLOAD_INVALID
        - TASK_STATE_NOT_FOUND
        - TEXT_ENCODED_TOOL_CALL
        - TOOL_AUTH_FAILED
        - TOOL_CALL_NOT_SUPPORTED
        - TOOL_DISPATCH_FAILED
        - TOOL_EGRESS_BLOCKED
        - TOOL_HTTP_ERROR
        - TOOL_NOT_FOUND
        - TOOL_RESPONSE_TOO_LARGE
        - TOOL_UNREACHABLE
        - UNAUTHORIZED
        - VALIDATION_FAILED
        - WORKFLOW_NOT_FOUND
        - WORK_AUTHORITY_MISSING
      x-iam-action: tasks:CreateTask
      x-iam-resource-type: task
      parameters:
        - $ref: './idempotency.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: >-
            The idempotency key already names a task created by the same
            request; that task is returned as it is now and no second task is
            created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: >-
            Bad request — invalid payload (`TASK_PAYLOAD_INVALID`), `state`
            does not name a declared state of the workflow
            (`TASK_STATE_NOT_FOUND`), or an invalid idempotency key
            (`VALIDATION_FAILED`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The idempotency key names a task created by a different request
            (`IDEMPOTENCY_KEY_REUSED`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'

  /api/v1/tasks/graph:
    get:
      description: >-
        A summary of each task `GET /tasks` selects with the same filters, as
        `data.nodes`, and the dependencies between them, as `data.edges`: one
        read draws a list, a graph or a tree. `upstream_of` answers what leads to one task. Answered
        whole, never paged: above `TASK_GRAPH_LIMIT` tasks it is refused with
        `TASK_GRAPH_TOO_LARGE`.
      tags:
        - Tasks
      summary: Get a task graph
      operationId: getTaskGraph
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - TASK_GRAPH_TOO_LARGE
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:ListTasks
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/TaskListProjectId'
        - name: workflow_id
          in: query
          required: false
          description: Only the tasks of this workflow.
          schema:
            type: string
        - $ref: '#/components/parameters/TaskStateFilter'
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskAutomationStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - $ref: '#/components/parameters/TaskAssigneeFilter'
        - $ref: '#/components/parameters/TaskBlockedFilter'
        - $ref: '#/components/parameters/TaskUpstreamOf'
        - $ref: './structured-filters.yaml#/components/parameters/MetadataQuery'
      responses:
        '200':
          description: The selected tasks and the dependencies between them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraph'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '422':
          description: The graph holds more than `TASK_GRAPH_LIMIT` tasks (`TASK_GRAPH_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/v1/tasks/{task_id}:
    get:
      description: Retrieves a task, including its active dispatch and automation status.
      tags:
        - Tasks
      summary: Get a task
      operationId: getTask
      x-raises:
        - FORBIDDEN
        - TASK_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:GetTask
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/WorkflowPin'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    patch:
      description: >-
        Updates a task's payload, title, assignee or metadata. `state` is never directly
        writable — move it with a transition; sending a `state` field is rejected
        as an unknown field (`VALIDATION_FAILED`). `payload` is shallow-merged over
        the existing payload (PATCH semantics): keys the request omits are
        preserved. The payload is caller-owned; the automation result lives in the
        read-only `last_result` field, which no patch can reach. The merged
        payload is validated against the workflow's `payload_schema`.
        `metadata`, unlike `payload`, replaces the stored bag whole.
      tags:
        - Tasks
      summary: Update a task
      operationId: updateTask
      x-raises:
        - FORBIDDEN
        - TASK_NOT_FOUND
        - TASK_PAYLOAD_INVALID
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:UpdateTask
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/WorkflowPin'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request (invalid payload)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    delete:
      description: >-
        Deletes a task. Its transition history and dependencies cascade; a
        dependent it was the last open dependency of is freed.
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      x-raises:
        - FORBIDDEN
        - TASK_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:DeleteTask
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/WorkflowPin'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'

  /api/v1/tasks/{task_id}/transitions:
    get:
      description: >-
        Lists every transition of the workflow version the task is pinned to,
        with whether firing it now as the caller would be accepted and, when
        not, the error code firing it would answer. The guard runs with the
        caller as `principal`. A `requires_approval` transition is allowed
        before its guard passes: the guard runs when the approval resolves.
        Advisory: firing re-validates under the task's lock.
      tags:
        - Tasks
      summary: List a task's transitions
      operationId: listTaskTransitions
      x-raises:
        - FORBIDDEN
        - TASK_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:GetTask
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/WorkflowPin'
        - name: task_id
          in: path
          required: true
          description: The task whose transitions are listed.
          schema:
            type: string
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: The pinned version's transitions, in definition order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaskTransitionOption'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      description: >-
        Fires a named transition on a task. The transition must exist in the
        workflow and be valid from the task's current state; its guard must pass.
        This is the single path every state change routes through. A transition
        declaring `requires_approval` does not move the task — it parks a pending
        ApprovalItem and returns the task with `pending_transition` set; the move
        applies only when the approval is approved.
      tags:
        - Tasks
      summary: Transition a task
      operationId: transitionTask
      x-raises:
        - FORBIDDEN
        - INVALID_TOOL_CONTEXT_KEY
        - TASK_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:TransitionTask
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/WorkflowPin'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
        - $ref: './idempotency.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionTaskRequest'
      responses:
        '200':
          description: The task after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: The transition does not exist, is not valid, or its guard rejected the move
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            A concurrent transition made this one invalid, the task is closed,
            or the idempotency key names a different request
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'

  /api/v1/tasks/{task_id}/migrate:
    post:
      description: >-
        Moves an open task onto a newer version of its workflow. A state the
        target version also declares maps to itself; `state_map` maps a state
        it lacks. The payload is re-validated against the target
        `payload_schema`. The mapped state's `on_enter` is not fired: transition
        the task when you want the target's automation. A task with a dispatch
        in flight or a transition pending approval is refused, since both
        belong to the version they started under. Recorded in history as a row
        with `transition: null` and both versions.
      tags:
        - Tasks
      summary: Migrate a task to a newer workflow version
      operationId: migrateTask
      x-raises:
        - FORBIDDEN
        - TASK_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: tasks:MigrateTask
      x-iam-resource-type: task
      parameters:
        - $ref: '#/components/parameters/WorkflowPin'
        - name: task_id
          in: path
          required: true
          description: The task to migrate.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateTaskRequest'
      responses:
        '200':
          description: The task on the target version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: >-
            The version does not exist or is not newer than the task's, the
            current state is unmapped, a mapped state is undeclared or
            terminal, or the payload fails the target `payload_schema`
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The task is closed, has a transition pending approval, or has a
            dispatch in flight
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'

  /api/v1/tasks/{task_id}/priority:
    put:
      description: >-
        Sets or clears a task's priority. An action of its own,
        `tasks:SetTaskPriority`, so a principal can update a task without
        reprioritising it; create-task and update-task do not accept
        `priority`.
      tags:
        - Tasks
      summary: Set a task's priority
