openapi: 3.0.3
info:
  title: SOAT Policies API
  version: 1.0.0
  description: >-
    API for managing policies: global ones (unrestricted admin only) and
    project policies, managed by whoever holds the `policies:*` actions in
    their project.
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Policies
    description: Manage policies
security:
  - bearerAuth: []
paths:
  /api/v1/policies:
    get:
      tags:
        - Policies
      summary: List policies
      description: >
        Returns the policies of the project `project_id` names, or of the
        project a project-scoped credential is bound to. Without either, the
        unrestricted admin lists every policy, global and project ones. Pass
        `user_id` (unrestricted admin only) to list only the policies attached
        to that user.
      operationId: listPolicies
      x-iam-action: policies:ListPolicies
      x-iam-resource-type: policy
      parameters:
        - name: project_id
          in: query
          required: false
          description: List only this project's policies (proj_...)
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: Return only policies attached to this user (user_...)
          schema:
            type: string
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PolicyRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Forbidden: the caller may not list policies in the project, or
            lists global policies without being the unrestricted admin
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      tags:
        - Policies
      summary: Create a policy
      description: >-
        Creates a project policy when `project_id` is given or the credential
        is bound to a project: its `Allow` statements may name only that
        project's resources (`srn:<project_id>:<type>:<id>`), else `400`.
        Without a project, creates a global policy, which only the
        unrestricted admin may.
      operationId: createPolicy
      x-iam-action: policies:CreatePolicy
      x-iam-resource-type: policy
      x-soat-agent-exclude: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document
              additionalProperties: false
              properties:
                project_id:
                  type: string
                  description: >-
                    The project the policy belongs to (proj_...). Defaults to
                    a project-scoped credential's own project; omitted
                    otherwise, the policy is global.
                  example: proj_V1StGXR8Z5jdHi6B
                name:
                  type: string
                  example: ReadOnlyAccess
                description:
                  type: string
                  example: Allows read-only access to all resources
                document:
                  $ref: '#/components/schemas/PolicyDocument'
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '400':
          description: >-
            Bad request: an invalid policy document, or an `Allow` resource
            outside the policy's project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
  /api/v1/policies/{policy_id}:
    get:
      tags:
        - Policies
      summary: Get a policy
      description: >-
        Returns a policy. A project policy needs `policies:GetPolicy` in its
        project; a global one, the unrestricted admin.
      operationId: getPolicy
      x-iam-action: policies:GetPolicy
      x-iam-resource-type: policy
      parameters:
        - name: policy_id
          in: path
          required: true
          description: Policy public ID (pol_ prefix)
          schema:
            type: string
            example: pol_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    put:
      tags:
        - Policies
      summary: Update a policy
      description: >-
        Updates a policy. A project policy needs `policies:UpdatePolicy` in its
        project and its `Allow` statements stay within that project; a global
        one, the unrestricted admin. The project never changes.
      operationId: updatePolicy
      x-iam-action: policies:UpdatePolicy
      x-iam-resource-type: policy
      x-soat-agent-exclude: true
      parameters:
        - name: policy_id
          in: path
          required: true
          description: Policy public ID (pol_ prefix)
          schema:
            type: string
            example: pol_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document
              additionalProperties: false
              properties:
                name:
                  type: string
                description:
                  type: string
                document:
                  $ref: '#/components/schemas/PolicyDocument'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '400':
          description: >-
            Bad request: an invalid policy document, or an `Allow` resource
            outside the policy's project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    delete:
      tags:
        - Policies
      summary: Delete a policy
      description: >-
        Deletes a policy. A project policy needs `policies:DeletePolicy` in its
        project; a global one, the unrestricted admin. Refused with `409
        POLICY_HAS_DEPENDENTS` while a trigger, agent or webhook names it in
        its `policy_ids`.
      operationId: deletePolicy
      x-iam-action: policies:DeletePolicy
      x-iam-resource-type: policy
      x-soat-agent-exclude: true
      parameters:
        - name: policy_id
          in: path
          required: true
          description: Policy public ID (pol_ prefix)
          schema:
            type: string
            example: pol_V1StGXR8Z5jdHi6B
      responses:
        '204':
          description: Policy deleted successfully
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `POLICY_HAS_DEPENDENTS`: a trigger, agent or webhook still names
            the policy in its `policy_ids`. Detach it or delete them first.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    PolicyStatement:
      type: object
      required:
        - effect
        - action
      properties:
        effect:
          type: string
          enum: [Allow, Deny]
          example: Allow
        action:
          type: array
          items:
            type: string
          example: ['files:ListFiles', 'files:CreateFile']
        resource:
          type: array
          items:
            type: string
          example: ['srn:proj_abc:files:*']
        condition:
          type: object
          additionalProperties: true
          description: >
            Optional condition block. Keys are condition operators (e.g.
            StringEquals) mapping to context-key/value maps; evaluated by the
            policy compiler. A context key must be one the platform supplies —
            `iam:ResourceType` or `iam:ResourceTag/<tag>` — because an
            unknown key is absent from the evaluation context, so a `Deny`
            naming one would never deny. The tag name after the slash is
            opaque and unconstrained. Operator and context keys are matched by
            exact string and are never case-converted, so they round-trip
            exactly as written: `iam:ResourceTag/cost_center` selects the tag
            `cost_center`, not `costCenter`.
          example: { StringEquals: { 'iam:ResourceTag/env': 'prod' } }
    PolicyDocument:
      type: object
      required:
        - statement
      properties:
        statement:
          type: array
          items:
            $ref: '#/components/schemas/PolicyStatement'
    PolicyRecord:
      type: object
      properties:
        id:
          type: string
          description: Public policy ID (pol_ prefix)
          example: pol_V1StGXR8Z5jdHi6B
        project_id:
          type: string
          nullable: true
          description: >-
            The project the policy belongs to; `null` for a global policy.
          example: proj_V1StGXR8Z5jdHi6B
        name:
          type: string
          nullable: true
          example: ReadOnlyAccess
        description:
          type: string
          nullable: true
        document:
          $ref: '#/components/schemas/PolicyDocument'
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
