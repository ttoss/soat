openapi: 3.0.3
info:
  title: SOAT Policies API
  version: 1.0.0
  description: >-
    API for managing policies: global ones (unrestricted admin only) and
    project policies, managed by whoever holds the `policies:*` actions in
    their project.
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Policies
    description: Manage policies
security:
  - bearerAuth: []
paths:
  /api/v1/policies:
    get:
      tags:
        - Policies
      summary: List policies
      description: >
        Returns the policies of the project `project_id` names, or of the
        project a project-scoped credential is bound to. `project_group_id`
        lists that project group's policies instead, which needs
        `project-groups:ListPolicies` on
        `srn:project-group:<project_group_id>:policy/*`. Without any, the
        unrestricted admin lists every policy, global, project and project
        group ones. Pass `user_id` (unrestricted admin only) to list only the
        policies attached to that user.
      operationId: listPolicies
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - INVALID_CURSOR
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: policies:ListPolicies
      x-iam-resource-type: policy
      parameters:
        - name: project_id
          in: query
          required: false
          description: List only this project's policies (proj_...)
          schema:
            type: string
        - name: project_group_id
          in: query
          required: false
          description: >-
            List only this project group's policies (pgrp_...); never with
            `project_id` or `user_id`
          schema:
            type: string
        - name: user_id
          in: query
          required: false
          description: Return only policies attached to this user (user_...)
          schema:
            type: string
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PolicyRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Forbidden: the caller may not list policies in the project, or
            lists global policies without being the unrestricted admin
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            The project group does not exist, or the caller may not read it
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      tags:
        - Policies
      summary: Create a policy
      description: >-
        Creates a project policy when `project_id` is given or the credential
        is bound to a project: its `Allow` statements may name only that
        project's resources (`srn:<project_id>:<type>:<id>`), else `400`; an
        `Allow` without `resource` grants every resource of that project.
        With `project_group_id`, creates a project group policy, which needs
        `project-groups:CreatePolicy` on
        `srn:project-group:<project_group_id>:policy/*`: its `Allow`
        statements may name only the project group's own resources
        (`srn:project-group:<project_group_id>:<type>/<id>`) and those of a
        project in it, else `400`; an `Allow` without `resource` grants a
        project group action on the project group and any other action on
        its projects, read when the policy is evaluated. Only the project
        group and its keys may carry it in `policy_ids`. Without a project or
        a project group, creates a global policy, which only the unrestricted
        admin may.
      operationId: createPolicy
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - POLICY_DENIAL_RESERVED
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: policies:CreatePolicy
      x-iam-resource-type: policy
      x-soat-agent-exclude: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document
              additionalProperties: false
              properties:
                project_id:
                  type: string
                  description: >-
                    The project the policy belongs to (proj_...). Defaults to
                    a project-scoped credential's own project; omitted
                    otherwise, the policy is global.
                  example: proj_V1StGXR8Z5jdHi6B
                project_group_id:
                  type: string
                  description: >-
                    The project group the policy belongs to (pgrp_...); never
                    with `project_id`.
                  example: pgrp_V1StGXR8Z5jdHi6B
                name:
                  type: string
                  example: ReadOnlyAccess
                description:
                  type: string
                  example: Allows read-only access to all resources
                document:
                  $ref: '#/components/schemas/PolicyDocument'
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '400':
          description: >-
            Bad request: an invalid policy document, or an `Allow` resource
            outside the policy's project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: >-
            The project group does not exist, or the caller may not read it
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/policies/{policy_id}:
    get:
      tags:
        - Policies
      summary: Get a policy
      description: >-
        Returns a policy. A project policy needs `policies:GetPolicy` in its
        project; a project group policy, `project-groups:GetPolicy` on
        `srn:project-group:<project_group_id>:policy/<policy_id>`; a global
        one, the unrestricted admin.
      operationId: getPolicy
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_NOT_FOUND
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: policies:GetPolicy
      x-iam-resource-type: policy
      parameters:
        - name: policy_id
          in: path
          required: true
          description: Policy public ID (pol_ prefix)
          schema:
            type: string
            example: pol_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: Policy details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    put:
      tags:
        - Policies
      summary: Update a policy
      description: >-
        Updates a policy. A project policy needs `policies:UpdatePolicy` in its
        project and its `Allow` statements stay within that project; a project
        group policy, `project-groups:UpdatePolicy` on
        `srn:project-group:<project_group_id>:policy/<policy_id>`, and its
        `Allow` statements stay within the project group; a global one, the
        unrestricted admin. The project or project group never changes.
      operationId: updatePolicy
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_NOT_FOUND
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - POLICY_DENIAL_RESERVED
        - POLICY_GRANT_NOT_HELD
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: policies:UpdatePolicy
      x-iam-resource-type: policy
      x-soat-agent-exclude: true
      parameters:
        - name: policy_id
          in: path
          required: true
          description: Policy public ID (pol_ prefix)
          schema:
            type: string
            example: pol_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document
              additionalProperties: false
              properties:
                name:
                  type: string
                description:
                  type: string
                document:
                  $ref: '#/components/schemas/PolicyDocument'
      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRecord'
        '400':
          description: >-
            Bad request: an invalid policy document, or an `Allow` resource
            outside the policy's project
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    delete:
      tags:
        - Policies
      summary: Delete a policy
      description: >-
        Deletes a policy. A project policy needs `policies:DeletePolicy` in its
        project; a project group policy, `project-groups:DeletePolicy` on
        `srn:project-group:<project_group_id>:policy/<policy_id>`; a global
        one, the unrestricted admin. Refused with `409
        POLICY_HAS_DEPENDENTS` while a trigger, agent, webhook, user, project
        group or API key names it in its `policy_ids`.
      operationId: deletePolicy
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_NOT_FOUND
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - POLICY_HAS_DEPENDENTS
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: policies:DeletePolicy
      x-iam-resource-type: policy
      x-soat-agent-exclude: true
      parameters:
        - name: policy_id
          in: path
          required: true
          description: Policy public ID (pol_ prefix)
          schema:
            type: string
            example: pol_V1StGXR8Z5jdHi6B
      responses:
        '204':
          description: Policy deleted successfully
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (the caller may not act on this policy)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `POLICY_HAS_DEPENDENTS`: a trigger, agent, webhook, user or API key still names
            the policy in its `policy_ids`. Detach it or delete them first.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    PolicyStatement:
      type: object
      additionalProperties: false
      required:
        - effect
        - action
      properties:
        effect:
          type: string
          enum: [Allow, Deny]
          example: Allow
        action:
          type: array
          items:
            type: string
          example: ['files:ListFiles', 'files:CreateFile']
        resource:
          type: array
          items:
            type: string
          description: >-
            Resource SRN patterns. Omitted, an `Allow` in a project policy
            matches every resource of the policy's project
            (`srn:<project_id>:*:*`); in a project group policy, the project
            group's own resources and those of its projects; anywhere else
            every resource.
          example: ['srn:proj_abc:files:*']
        condition:
          type: object
          additionalProperties: true
          description: >
            Optional condition block. Keys are condition operators (e.g.
            StringEquals) mapping to context-key/value maps; evaluated by the
            policy compiler. A context key must be one the platform supplies —
            `iam:ResourceType`, `iam:ResourceTag/<tag>` (the tag on the target
            resource) or `iam:RequestTag/<key>` (the tag value the request
            writes) — because an unknown key is absent from the evaluation
            context, so a `Deny` naming one would never deny. The tag name
            after the slash is opaque and unconstrained. Operator and context
            keys are matched by exact string and are never case-converted, so
            they round-trip exactly as written: `iam:ResourceTag/cost_center`
            selects the tag `cost_center`, not `costCenter`.
          example: { StringEquals: { 'iam:ResourceTag/env': 'prod' } }
        denial:
          $ref: '#/components/schemas/PolicyDenial'
    PolicyDenial:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      description: >-
        On a `Deny` only: what a request this statement denies answers in place
        of `FORBIDDEN`. `code` is one the deployment declares; `meta` is added
        beside `action`, `resource` and `denied_by`. Only an unrestricted admin
        writes a policy carrying one (`403 POLICY_DENIAL_RESERVED`).
      properties:
        code:
          type: string
          example: PLAN_FEATURE_NOT_INCLUDED
        message:
          type: string
          example: Guardrails are not included in this plan.
        meta:
          type: object
          additionalProperties: true
          description: Snake_case keys, none of `action`, `resource`, `denied_by`.
          example: { feature: guardrails }
    PolicyDocument:
      type: object
      additionalProperties: false
      required:
        - statement
      properties:
        statement:
          type: array
          items:
            $ref: '#/components/schemas/PolicyStatement'
    PolicyRecord:
      type: object
      properties:
        id:
          type: string
          description: Public policy ID (pol_ prefix)
          example: pol_V1StGXR8Z5jdHi6B
        project_id:
          type: string
          nullable: true
          description: >-
            The project the policy belongs to; `null` for a global or a
            project group policy.
          example: proj_V1StGXR8Z5jdHi6B
        project_group_id:
          type: string
          nullable: true
          description: >-
            The project group the policy belongs to; `null` for a global or a
            project policy.
          example: pgrp_V1StGXR8Z5jdHi6B
        name:
          type: string
          nullable: true
          example: ReadOnlyAccess
        description:
          type: string
          nullable: true
        document:
          $ref: '#/components/schemas/PolicyDocument'
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
