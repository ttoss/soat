openapi: 3.0.3
info:
  title: SOAT Project Groups API
  version: 1.0.0
  description: >-
    Project groups: an authorization scope above the project. A project group's
    attached policies cap every check in it, on its projects and on its own
    resources, `srn:project-group:<project_group_id>:<type>/<id>`.
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: Project Groups
    description: Manage project groups
security:
  - bearerAuth: []
paths:
  /api/v1/project-groups:
    get:
      tags:
        - Project Groups
      summary: List project groups
      description: >-
        Every group for the unrestricted admin; for anyone else, the project groups the
        caller owns and may read (`project-groups:GetProjectGroup`).
      operationId: listProjectGroups
      x-raises:
        - INVALID_CURSOR
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: project-groups:ListProjectGroups
      x-soat-agent-exclude: true
      parameters:
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Project groups returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectGroupRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    post:
      tags:
        - Project Groups
      summary: Create a project group
      description: >-
        Creates a project group owned by `owner_id`. Unrestricted admin only. The
        writer holds every grant of the policies it attaches.
      operationId: createProjectGroup
      x-raises:
        - ACTION_NOT_HELD
        - FORBIDDEN
        - POLICY_GRANT_NOT_HELD
        - POLICY_NOT_FOUND
        - POLICY_OUTSIDE_PROJECT
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: project-groups:CreateProjectGroup
      x-soat-agent-exclude: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupCreateRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/project-groups/{project_group_id}:
    get:
      tags:
        - Project Groups
      summary: Get a project group
      description: >-
        Needs `project-groups:GetProjectGroup` on `srn:project-group:<project_group_id>:*`; a caller who may
        not read the project group gets `404`.
      operationId: getProjectGroup
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: project-groups:GetProjectGroup
      x-soat-agent-exclude: true
      parameters:
        - name: project_group_id
          in: path
          required: true
          description: Group public ID (pgrp_ prefix)
          schema:
            type: string
            example: pgrp_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: Group returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    patch:
      tags:
        - Project Groups
      summary: Update a project group
      description: >-
        Needs `project-groups:UpdateProjectGroup` on `srn:project-group:<project_group_id>:*`.
        `fixed_policy_ids` is written by the unrestricted admin only, so the
        owner can neither detach nor edit a fixed policy.
      operationId: updateProjectGroup
      x-raises:
        - ACTION_NOT_HELD
        - FORBIDDEN
        - POLICY_GRANT_NOT_HELD
        - POLICY_NOT_FOUND
        - POLICY_OUTSIDE_PROJECT
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: project-groups:UpdateProjectGroup
      x-soat-agent-exclude: true
      parameters:
        - name: project_group_id
          in: path
          required: true
          description: Group public ID (pgrp_ prefix)
          schema:
            type: string
            example: pgrp_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectGroupUpdateRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectGroupRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    delete:
      tags:
        - Project Groups
      summary: Delete a project group
      description: >-
        Deletes a project group holding no project, and its project group keys. Unrestricted
        admin only.
      operationId: deleteProjectGroup
      x-raises:
        - FORBIDDEN
        - PROJECT_GROUP_HAS_PROJECTS
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: project-groups:DeleteProjectGroup
      x-soat-agent-exclude: true
      parameters:
        - name: project_group_id
          in: path
          required: true
          description: Group public ID (pgrp_ prefix)
          schema:
            type: string
            example: pgrp_V1StGXR8Z5jdHi6B
      responses:
        '204':
          description: Group deleted
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '409':
          description: The project group holds projects
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/project-groups/{project_group_id}/projects:
    post:
      tags:
        - Project Groups
      summary: Create a project in a project group
      description: >-
        Needs `project-groups:CreateProject` on `srn:project-group:<project_group_id>:project/*`.
      operationId: createProjectGroupProject
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: project-groups:CreateProject
      x-soat-agent-exclude: true
      parameters:
        - name: project_group_id
          in: path
          required: true
          description: Group public ID (pgrp_ prefix)
          schema:
            type: string
            example: pgrp_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  description: The project's name.
                  example: Support bot
      responses:
        '201':
          description: Project created in the project group
          content:
            application/json:
              schema:
                $ref: './projects.yaml#/components/schemas/ProjectRecord'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/project-groups/{project_group_id}/projects/{project_id}:
    put:
      tags:
        - Project Groups
      summary: Add a project to a project group
      description: >-
        Moves the project into the project group, out of any other. Unrestricted admin
        only.
      operationId: addProjectGroupProject
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: project-groups:AddProjectGroupProject
      x-soat-agent-exclude: true
      parameters:
        - name: project_group_id
          in: path
          required: true
          description: Group public ID (pgrp_ prefix)
          schema:
            type: string
            example: pgrp_V1StGXR8Z5jdHi6B
        - name: project_id
          in: path
          required: true
          description: Project public ID (proj_ prefix)
          schema:
            type: string
            example: proj_V1StGXR8Z5jdHi6B
      responses:
        '204':
          description: Project added
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    delete:
      tags:
        - Project Groups
      summary: Remove a project from a project group
      description: Takes the project out of the project group. Unrestricted admin only.
      operationId: removeProjectGroupProject
      x-raises:
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: project-groups:RemoveProjectGroupProject
      x-soat-agent-exclude: true
      parameters:
        - name: project_group_id
          in: path
          required: true
          description: Group public ID (pgrp_ prefix)
          schema:
            type: string
            example: pgrp_V1StGXR8Z5jdHi6B
        - name: project_id
          in: path
          required: true
          description: Project public ID (proj_ prefix)
          schema:
            type: string
            example: proj_V1StGXR8Z5jdHi6B
      responses:
        '204':
          description: Project removed
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          $ref: './errors.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './errors.yaml#/components/responses/Forbidden'
        '404':
          $ref: './errors.yaml#/components/responses/NotFound'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
  schemas:
    ProjectGroupRecord:
      type: object
      required:
        - id
        - name
        - owner_id
        - policy_ids
        - fixed_policy_ids
        - project_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Public project group ID (pgrp_ prefix)
          example: pgrp_V1StGXR8Z5jdHi6B
        name:
          type: string
          description: The project group's name.
          example: Acme
        owner_id:
          type: string
          nullable: true
          description: >-
            The user holding the project group's own resources: every project group action on
            `srn:project-group:<project_group_id>:*`, capped by the project group's policies.
          example: user_V1StGXR8Z5jdHi6B
        policy_ids:
          type: array
          x-soat-ref: policies
          description: >-
            Policies the owner attached: global ones or policies of a project
            in the project group. With `fixed_policy_ids` they cap every check in the
            project group; none caps nothing.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6B']
        fixed_policy_ids:
          type: array
          x-soat-ref: policies
          description: >-
            Global policies the unrestricted admin attached; only it writes
            them.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6C']
        project_ids:
          type: array
          description: The projects in the project group.
          items:
            type: string
          example: ['proj_V1StGXR8Z5jdHi6B']
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00.000Z'
    ProjectGroupCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - owner_id
      properties:
        name:
          type: string
          description: The project group's name.
          example: Acme
        owner_id:
          type: string
          description: The user who owns the project group.
          example: user_V1StGXR8Z5jdHi6B
        policy_ids:
          type: array
          x-soat-ref: policies
          description: The owner's policies capping the project group.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6B']
        fixed_policy_ids:
          type: array
          x-soat-ref: policies
          description: Global policies capping the project group that only the admin writes.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6C']
    ProjectGroupUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The project group's name.
          example: Acme
        policy_ids:
          type: array
          x-soat-ref: policies
          description: Replaces the owner's policies.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6B']
        fixed_policy_ids:
          type: array
          x-soat-ref: policies
          description: Replaces the fixed policies; unrestricted admin only.
          items:
            type: string
          example: ['pol_V1StGXR8Z5jdHi6C']
