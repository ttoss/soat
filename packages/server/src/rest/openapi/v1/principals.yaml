openapi: 3.0.3
info:
  title: SOAT Principals
  version: 1.0.0
  description: >-
    Shared components for naming who did something. This file declares no
    paths: every record that names a principal — a `<verb>_by_principal_type` /
    `<verb>_by_principal_id` pair, or a bare `principal_type` / `principal_id`
    on a record about the principal itself — references the one vocabulary
    here, and serves whom that principal acted for beside it
    (`<verb>_by_acts_for`, or a bare `acts_for`).
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
paths: {}
components:
  schemas:
    PrincipalType:
      type: string
      enum:
        - user
        - api_key
        - agent
        - automation
        - approval
        - trigger
        - system
        - eval
        - decider
        - ingestion_rule
        - memory_rule
        - playbook_version
      description: >-
        What kind of principal acted. `user` and `api_key` are authenticated
        callers, and the id is the user's (`user_…`) or the key's own
        (`key_…`), so a record names which key acted rather than its owner.
        `agent` is an agent writing under its own identity (`agent_…`).
        `automation` is the task engine acting on a dispatch outcome and
        `approval` an approval resolution; neither carries an id. `trigger` is
        a trigger firing under its own `policy_ids` (`trg_…`). `system` is
        the platform itself, with an id naming the mechanism
        (`retention_sweep`, `zero_retention`). `eval`, `decider`,
        `ingestion_rule`, `memory_rule` and `playbook_version` are that
        resource's work running under its own `policy_ids` when nobody
        started it, the id its own.
      example: user
    ActingPrincipalType:
      type: string
      enum:
        - user
        - api_key
        - trigger
        - eval
        - decider
        - ingestion_rule
        - memory_rule
        - playbook_version
      description: >-
        The `PrincipalType` values a credential or stored work acts as, and so
        every type a request naming the acting principal can carry (an
        admission question's `principal.type`).
      example: user
    ActsFor:
      type: object
      nullable: true
      description: >-
        The opaque principal the named principal acted for: the `principal` of
        the IAM token that made the request, or the one an `On-Behalf-Of`
        assertion carried. The principal pair beside it names the key that
        minted the token. Null when the request named none, and on work no
        request started.
      required: [type, id]
      properties:
        type:
          type: string
          example: channel
        id:
          type: string
          example: discord-dm-42
