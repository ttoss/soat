openapi: 3.0.3
info:
  title: SOAT AI Providers API
  version: 1.0.0
  description: API for managing LLM provider configurations (AI Providers resource)
  contact:
    name: SOAT Team
    url: https://github.com/ttoss/soat
servers:
  - url: '{baseUrl}'
    description: Base URL of your SOAT deployment (e.g. https://your-soat.com or http://localhost:5047)
    variables:
      baseUrl:
        description: The base URL of your SOAT deployment
        default: http://localhost:5047
tags:
  - name: AI Providers
    description: Manage AI providers
security:
  - bearerAuth: []
paths:
  /api/v1/ai-providers:
    get:
      tags:
        - AI Providers
      summary: List AI providers
      description: Returns a list of AI provider configurations for a project
      operationId: listAiProviders
      x-raises:
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - INVALID_CURSOR
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: ai-providers:ListAiProviders
      x-iam-resource-type: aiProvider
      parameters:
        - name: project_id
          in: query
          description: Project ID (required if not using project key auth)
          schema:
            type: string
            example: proj_V1StGXR8Z5jdHi6B
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: List of AI providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './pagination.yaml#/components/schemas/Page'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            provider:
                              type: string
                              enum:
                                [
                                  openai,
                                  anthropic,
                                  google,
                                  xai,
                                  groq,
                                  ollama,
                                  azure,
                                  bedrock,
                                  vertex,
                                  gateway,
                                  custom,
                                ]
                            default_model:
                              type: string
                            secret_id:
                              x-soat-ref: secrets
                              type: string
                              nullable: true
                              description: Secret ID containing API credentials, or null when the record links none.
                            base_url:
                              type: string
                              description: Custom base URL for the provider. Absent when the record sets none.
                            config:
                              type: object
                              description: 'Additional provider-specific configuration. Absent when the record sets none. Never carries a credential.'
                            model_aliases:
                              type: object
                              additionalProperties:
                                $ref: '#/components/schemas/ModelAliasTarget'
                              description: 'Alias → the model id sent to the vendor, or `{ ai_provider_id, model }` naming another provider of the project that serves it. A model named beside this provider may be an alias; reads, usage, prices and traces answer the alias and this provider, and only the vendor call uses the target and the id. Empty when the provider has none.'
                            model_aliases_only:
                              type: boolean
                              description: 'When `true`, a model that is not one of `model_aliases` is refused with `MODEL_NOT_OFFERED` (400).'
                            model_input_modalities:
                              description: 'Model name (or alias) → the input modalities it accepts. A message part of a modality its model lacks is refused with `INPUT_MODALITY_UNSUPPORTED` (400) before the provider is called; a model absent from the map is sent every part.'
                              allOf:
                                - $ref: '#/components/schemas/ModelInputModalities'
                            model_input_limits:
                              description: 'Model name (or alias) → the input limits it declares, each a positive integer: `max_bytes` per file part of a modality, `max_pages` per PDF, `max_parts` file parts per request. A request over one is refused with `INPUT_LIMIT_EXCEEDED` (400) before the provider is called; a model absent from the map, or a limit it omits, is not checked.'
                              allOf:
                                - $ref: '#/components/schemas/ModelInputLimits'
                            require_priced_model:
                              type: boolean
                              description: "When `true`, a generation on this provider whose model no price-book row covers is refused with `MODEL_NOT_PRICED` (409) before the provider is called, as the project's `require_priced_model` does for every provider of the project."
                            project_id:
                              x-soat-ref: projects
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
    post:
      tags:
        - AI Providers
      summary: Create an AI provider
      description: |
        Creates a new LLM provider configuration.

        A provider's credential is its linked `secret_id`; `config.apiKey` is
        refused with `400 VALIDATION_FAILED`.

        A record with both `base_url` and `secret_id` sends the secret to that
        URL, so creating one also needs `secrets:UseSecret` on the secret, else
        `403`.

        A `bedrock` or `vertex` record must link one. Without it the provider
        SDK signs with the server's own credentials (the AWS default credential
        chain, Google Application Default Credentials), which is refused with
        `400 VALIDATION_FAILED` unless the deployment allows it.
      operationId: createAiProvider
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_MISCONFIGURED
        - AI_PROVIDER_NOT_FOUND
        - API_KEY_PROJECT_SCOPE
        - FORBIDDEN
        - MODEL_NOT_OFFERED
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: ai-providers:CreateAiProvider
      x-iam-resource-type: aiProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - provider
                - default_model
              additionalProperties: false
              properties:
                project_id:
                  x-soat-ref: projects
                  type: string
                  description: Project ID (required if not using project key auth)
                  example: proj_V1StGXR8Z5jdHi6B
                name:
                  type: string
                  description: Provider configuration name
                  example: OpenAI Production
                provider:
                  type: string
                  enum:
                    [
                      openai,
                      anthropic,
                      google,
                      xai,
                      groq,
                      ollama,
                      azure,
                      bedrock,
                      vertex,
                      gateway,
                      custom,
                    ]
                  description: LLM provider
                  example: openai
                default_model:
                  type: string
                  description: Default model to use
                  example: gpt-4
                secret_id:
                  x-soat-ref: secrets
                  type: string
                  description: Secret ID containing API credentials. Required for `bedrock` and `vertex`.
                  example: sec_V1StGXR8Z5jdHi6B
                base_url:
                  type: string
                  description: Custom base URL for the provider
                config:
                  type: object
                  description: 'Additional provider-specific configuration. `apiKey` is refused: the credential goes in the linked secret.'
                model_aliases:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/ModelAliasTarget'
                  description: 'Alias → the model id sent to the vendor, or `{ ai_provider_id, model }` naming another provider of the project that serves it.'
                  example:
                    fast: gpt-4o-mini
                model_aliases_only:
                  type: boolean
                  default: false
                  description: 'When `true`, a model that is not one of `model_aliases` is refused with `MODEL_NOT_OFFERED` (400).'
                model_input_modalities:
                  description: 'Model name (or alias) → the input modalities it accepts. A message part of a modality its model lacks is refused with `INPUT_MODALITY_UNSUPPORTED` (400) before the provider is called; a model absent from the map is sent every part.'
                  allOf:
                    - $ref: '#/components/schemas/ModelInputModalities'
                model_input_limits:
                  description: 'Model name (or alias) → the input limits it declares, each a positive integer: `max_bytes` per file part of a modality, `max_pages` per PDF, `max_parts` file parts per request. A request over one is refused with `INPUT_LIMIT_EXCEEDED` (400) before the provider is called; a model absent from the map, or a limit it omits, is not checked.'
                  allOf:
                    - $ref: '#/components/schemas/ModelInputLimits'
                require_priced_model:
                  type: boolean
                  default: false
                  description: "When `true`, a generation on this provider whose model no price-book row covers is refused with `MODEL_NOT_PRICED` (409) before the provider is called, as the project's `require_priced_model` does for every provider of the project."
      responses:
        '201':
          description: AI provider created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  provider:
                    type: string
                  default_model:
                    type: string
                  model_aliases:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ModelAliasTarget'
                    description: 'Alias → the model id sent to the vendor, or `{ ai_provider_id, model }` naming another provider of the project that serves it. A model named beside this provider may be an alias; reads, usage, prices and traces answer the alias and this provider, and only the vendor call uses the target and the id. Empty when the provider has none.'
                  model_aliases_only:
                    type: boolean
                    description: 'When `true`, a model that is not one of `model_aliases` is refused with `MODEL_NOT_OFFERED` (400).'
                  model_input_modalities:
                    description: 'Model name (or alias) → the input modalities it accepts. A message part of a modality its model lacks is refused with `INPUT_MODALITY_UNSUPPORTED` (400) before the provider is called; a model absent from the map is sent every part.'
                    allOf:
                      - $ref: '#/components/schemas/ModelInputModalities'
                  model_input_limits:
                    description: 'Model name (or alias) → the input limits it declares, each a positive integer: `max_bytes` per file part of a modality, `max_pages` per PDF, `max_parts` file parts per request. A request over one is refused with `INPUT_LIMIT_EXCEEDED` (400) before the provider is called; a model absent from the map, or a limit it omits, is not checked.'
                    allOf:
                      - $ref: '#/components/schemas/ModelInputLimits'
                  require_priced_model:
                    type: boolean
                    description: "When `true`, a generation on this provider whose model no price-book row covers is refused with `MODEL_NOT_PRICED` (409) before the provider is called, as the project's `require_priced_model` does for every provider of the project."
                  project_id:
                    x-soat-ref: projects
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request (invalid provider or missing fields)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/ai-providers/{ai_provider_id}:
    get:
      tags:
        - AI Providers
      summary: Get an AI provider
      description: >
        Returns a specific AI provider configuration. A credential scoped to a
        project the provider is shared with, through an accepted share, reads
        its `id`, `name`, `provider`, `default_model`, `model_alias_names`,
        `model_input_modalities` and `model_input_limits` only.
      operationId: getAiProvider
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_NOT_FOUND
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: ai-providers:GetAiProvider
      x-iam-resource-type: aiProvider
      parameters:
        - name: ai_provider_id
          in: path
          required: true
          description: AI Provider ID
          schema:
            type: string
            example: aip_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: AI provider details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  provider:
                    type: string
                  default_model:
                    type: string
                  project_id:
                    x-soat-ref: projects
                    type: string
                  secret_id:
                    x-soat-ref: secrets
                    type: string
                    nullable: true
                  base_url:
                    type: string
                  config:
                    type: object
                    description: 'Additional provider-specific configuration. Never carries a credential.'
                  model_aliases:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/ModelAliasTarget'
                    description: 'Alias → the model id sent to the vendor, or `{ ai_provider_id, model }` naming another provider of the project that serves it. A model named beside this provider may be an alias; reads, usage, prices and traces answer the alias and this provider, and only the vendor call uses the target and the id. Empty when the provider has none.'
                  model_alias_names:
                    type: array
                    items:
                      type: string
                    description: 'The alias names of `model_aliases`, on a shared projection only.'
                  model_aliases_only:
                    type: boolean
                    description: 'When `true`, a model that is not one of `model_aliases` is refused with `MODEL_NOT_OFFERED` (400).'
                  model_input_modalities:
                    description: 'Model name (or alias) → the input modalities it accepts. A message part of a modality its model lacks is refused with `INPUT_MODALITY_UNSUPPORTED` (400) before the provider is called; a model absent from the map is sent every part.'
                    allOf:
                      - $ref: '#/components/schemas/ModelInputModalities'
                  model_input_limits:
                    description: 'Model name (or alias) → the input limits it declares, each a positive integer: `max_bytes` per file part of a modality, `max_pages` per PDF, `max_parts` file parts per request. A request over one is refused with `INPUT_LIMIT_EXCEEDED` (400) before the provider is called; a model absent from the map, or a limit it omits, is not checked.'
                    allOf:
                      - $ref: '#/components/schemas/ModelInputLimits'
                  require_priced_model:
                    type: boolean
                    description: "When `true`, a generation on this provider whose model no price-book row covers is refused with `MODEL_NOT_PRICED` (409) before the provider is called, as the project's `require_priced_model` does for every provider of the project."
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: AI provider not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    patch:
      tags:
        - AI Providers
      summary: Update an AI provider
      description: Updates an AI provider configuration. Setting `base_url` or `secret_id` so the record holds both also needs `secrets:UseSecret` on the secret, else `403`.
      operationId: updateAiProvider
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_MISCONFIGURED
        - AI_PROVIDER_NOT_FOUND
        - FORBIDDEN
        - MODEL_NOT_OFFERED
        - RESOURCE_NOT_FOUND
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: ai-providers:UpdateAiProvider
      x-iam-resource-type: aiProvider
      parameters:
        - name: ai_provider_id
          in: path
          required: true
          description: AI Provider ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                provider:
                  type: string
                  enum:
                    [
                      openai,
                      anthropic,
                      google,
                      xai,
                      groq,
                      ollama,
                      azure,
                      bedrock,
                      vertex,
                      gateway,
                      custom,
                    ]
                  description: LLM provider
                  example: openai
                default_model:
                  type: string
                secret_id:
                  x-soat-ref: secrets
                  type: string
                  nullable: true
                base_url:
                  type: string
                config:
                  type: object
                  description: 'Replaces the whole configuration. `apiKey` is refused: the credential goes in the linked secret.'
                model_aliases:
                  type: object
                  nullable: true
                  additionalProperties:
                    $ref: '#/components/schemas/ModelAliasTarget'
                  description: 'Alias → the model id sent to the vendor, or `{ ai_provider_id, model }` naming another provider of the project that serves it. Replaces the whole map; `null` clears it.'
                  example:
                    fast: gpt-4o-mini
                model_aliases_only:
                  type: boolean
                  description: 'When `true`, a model that is not one of `model_aliases` is refused with `MODEL_NOT_OFFERED` (400).'
                model_input_modalities:
                  nullable: true
                  description: 'Model name (or alias) → the input modalities it accepts. A message part of a modality its model lacks is refused with `INPUT_MODALITY_UNSUPPORTED` (400) before the provider is called; a model absent from the map is sent every part. Replaces the whole map; `null` clears it.'
                  allOf:
                    - $ref: '#/components/schemas/ModelInputModalities'
                model_input_limits:
                  nullable: true
                  description: 'Model name (or alias) → the input limits it declares, each a positive integer: `max_bytes` per file part of a modality, `max_pages` per PDF, `max_parts` file parts per request. A request over one is refused with `INPUT_LIMIT_EXCEEDED` (400) before the provider is called; a model absent from the map, or a limit it omits, is not checked. Replaces the whole map; `null` clears it.'
                  allOf:
                    - $ref: '#/components/schemas/ModelInputLimits'
                require_priced_model:
                  type: boolean
                  description: "When `true`, a generation on this provider whose model no price-book row covers is refused with `MODEL_NOT_PRICED` (409) before the provider is called, as the project's `require_priced_model` does for every provider of the project."
      responses:
        '200':
          description: AI provider updated successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: AI provider not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
    delete:
      tags:
        - AI Providers
      summary: Delete an AI provider
      description: >
        Deletes an AI provider configuration.


        Live references — the provider project's chats, agents, model routes
        whose targets name this provider, and providers whose `model_aliases`
        forward to it (`meta.ai_provider_ids`) — always block deletion with
        `409 AI_PROVIDER_HAS_DEPENDENTS`; `force` does
        not override them, so delete or repoint those resources first. Soft
        dependents — price overrides, usage/generation records and shares
        another project has accepted — also block with `409` unless
        `force=true`, which deletes the provider's price overrides, revokes
        its shares and unlinks its usage history, preserving those rows: each
        usage event keeps the provider's id as its `ai_provider_id`. A grantee
        project's agents and chats pinned to the provider fall back to that
        project's default route.
        The `409` body's `error.meta`
        reports the counts, a sample of offending IDs, and a `forcible` flag that
        is `true` when a `force=true` retry would succeed.
      operationId: deleteAiProvider
      x-raises:
        - AI_PROVIDER_HAS_DEPENDENTS
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: ai-providers:DeleteAiProvider
      x-iam-resource-type: aiProvider
      parameters:
        - name: ai_provider_id
          in: path
          required: true
          description: AI Provider ID
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: >
            When `true`, delete the provider's price overrides, revoke its
            shares and unlink its usage history so a provider with only soft
            dependents can be
            removed. Has no effect on live references (chats, agents, model
            routes), which always block deletion.
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: AI provider deleted successfully
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: AI provider not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '409':
          description: >
            The AI provider still has dependents. Live references always block;
            soft dependents block unless force=true. See error.meta for counts,
            offending IDs, and the forcible flag.
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
  /api/v1/ai-providers/{ai_provider_id}/models:
    get:
      tags:
        - AI Providers
      summary: List the models this provider can run
      description: >
        Asks the provider which models it can run, using this provider record's
        own credentials and configuration, and returns provider-native model ids
        — the same strings `default_model` and an agent's `model` carry.

        A provider with `model_aliases_only: true` answers its `model_aliases`
        names instead, sorted, each carrying only `id`, without calling the
        vendor; every provider type, `ollama` and `azure` included, lists this
        way.

        Which models are reachable is a property of the credential, not of the
        provider type: a Vertex provider sees only the publisher models its
        Google Cloud project and location serve, and a Bedrock provider only the
        foundation models enabled in its region. Reading the list is how a caller
        avoids pinning a model that fails at generation time.

        Not every provider type can answer. `azure` lists deployments an operator
        named rather than models, and `ollama` lists whatever was pulled onto that
        host, so both return `400 MODEL_LISTING_UNSUPPORTED`.

        Listing resolves credentials the same way generation does, so a record
        that can generate can list. The API-key types (`openai`, `groq`, `xai`,
        `gateway`, `custom`, `anthropic`, `google`) use the record's linked
        secret and cannot list without one. `bedrock` and `vertex` use the
        linked secret — IAM keys or a Bedrock API key, a Google service-account
        key. A record with no `secret_id` would fall back to the server's own
        credentials (the AWS default credential chain, Google Application
        Default Credentials); it can list only on a deployment that allows a
        record to use them, and returns `400 AI_PROVIDER_MISCONFIGURED`
        otherwise.

        A Vertex record needs no `config.project` when its secret is a
        service-account key, since the key file names its own project. A Vertex
        record in express mode (API key) cannot list at all: the publisher-model
        listing rejects API keys and needs a credential that asserts a
        principal, so it returns `400 MODEL_LISTING_UNSUPPORTED`.

        The Vertex answer is the publisher catalogue the record's
        `config.location` region serves. The project behind the credential is
        billed and quota'd for the call but does not filter the result, so a
        listed model may still be unavailable to that project at generation
        time.

        The provider answers its whole catalogue in one call; `q`, `limit` and
        `cursor` narrow and page what it returned. A request without `limit`
        gets the first 50 models.
      operationId: listAiProviderModels
      x-raises:
        - AGENT_NOT_FOUND
        - AI_PROVIDER_MISCONFIGURED
        - AI_PROVIDER_NOT_FOUND
        - FORBIDDEN
        - INVALID_CURSOR
        - MODEL_LISTING_FAILED
        - MODEL_LISTING_UNSUPPORTED
        - RESOURCE_NOT_FOUND
        - TOOL_EGRESS_BLOCKED
        - TOOL_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: ai-providers:ListAiProviderModels
      x-iam-resource-type: aiProvider
      parameters:
        - name: ai_provider_id
          in: path
          required: true
          description: AI Provider ID
          schema:
            type: string
            example: aip_V1StGXR8Z5jdHi6B
        - name: q
          in: query
          description: >
            Keeps the models whose `id` or `display_name` contains this text,
            ignoring case. Applied before paging.
          schema:
            type: string
            example: sonnet
        - $ref: './pagination.yaml#/components/parameters/Limit'
        - $ref: './pagination.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: The models this provider can run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderModelsResponse'
        '400':
          description: >
            The provider type or authentication mode cannot enumerate models
            (including Vertex express mode), or the record is missing
            configuration the listing needs (a Vertex project from either
            `config.project` or the service-account key file, a Bedrock region,
            or — for the API-key provider types — a linked secret).
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: AI provider not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '502':
          description: The provider rejected the listing request
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
  /api/v1/ai-providers/{ai_provider_id}/prices:
    get:
      tags:
        - AI Providers
      summary: List per-provider price overrides
      description: >
        Returns the per-provider price overrides for this AI provider instance.
        An override prices this specific provider (e.g. an enterprise-negotiated
        rate or a gateway with markup) and wins over the global default at cost
        time. Authorized by the caller's access to the provider's project — so,
        unlike the global price book, a project's own overrides are visible here.
      operationId: getAiProviderPrices
      x-raises:
        - AI_PROVIDER_NOT_FOUND
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
      x-iam-action: ai-providers:GetAiProviderPrices
      x-iam-resource-type: aiProvider
      parameters:
        - name: ai_provider_id
          in: path
          required: true
          description: AI Provider ID
          schema:
            type: string
            example: aip_V1StGXR8Z5jdHi6B
      responses:
        '200':
          description: The provider's price overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPricesResponse'
        '400':
          $ref: './errors.yaml#/components/responses/BadRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: AI provider not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
    put:
      tags:
        - AI Providers
      summary: Upsert per-provider price overrides
      description: >
        Upserts price overrides for this AI provider instance, keyed on
        (model, effective_from). The provider slug is taken from the AI provider
        itself, so only the model, rates, and effective_from are supplied.
        Authorized by the caller's access to the provider's project.
        `effective_from` must be in the future once the (model, component) has a
        price row — past prices are immutable, so corrections ship as new
        future-dated rows. A first price for a (model, component) nothing prices
        yet may be dated now or earlier, so a new provider is never live and
        unpriced.
      operationId: updateAiProviderPrices
      x-raises:
        - AI_PROVIDER_NOT_FOUND
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - UNAUTHORIZED
        - VALIDATION_FAILED
      x-iam-action: ai-providers:ManageAiProviderPrices
      x-iam-resource-type: aiProvider
      x-soat-agent-exclude: true
      parameters:
        - name: ai_provider_id
          in: path
          required: true
          description: AI Provider ID
          schema:
            type: string
            example: aip_V1StGXR8Z5jdHi6B
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProviderPricesRequest'
      responses:
        '200':
          description: The upserted price overrides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPricesResponse'
        '400':
          description: Bad Request (e.g. non-future effective_from)
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '404':
          description: AI provider not found
          content:
            application/json:
              schema:
                $ref: './errors.yaml#/components/schemas/ErrorResponse'
        '413':
          $ref: './errors.yaml#/components/responses/PayloadTooLarge'
        '429':
          $ref: './errors.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: './errors.yaml#/components/responses/InternalError'
        '4XX':
          $ref: './errors.yaml#/components/responses/AdmissionRefused'
        '502':
          $ref: './errors.yaml#/components/responses/AdmissionUnavailable'
components:
  schemas:
    ModelInputModalities:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
          enum:
            - text
            - image
            - file
            - audio
            - video
      example:
        gpt-4o:
          - text
          - image
          - file
    InputLimits:
      type: object
      description: >
        What one model reads per request. A limit it omits is not checked.
      additionalProperties: false
      properties:
        max_bytes:
          type: object
          description: Bytes per file part, by the part's modality
          additionalProperties: false
          properties:
            image:
              type: integer
              minimum: 1
            file:
              type: integer
              minimum: 1
            audio:
              type: integer
              minimum: 1
            video:
              type: integer
              minimum: 1
        max_duration_seconds:
          type: object
          description: >
            Seconds per audio or video file part, read from the container's
            headers; a part whose duration cannot be read is refused with
            `MEDIA_PARSE_FAILED`
          additionalProperties: false
          properties:
            audio:
              type: integer
              minimum: 1
            video:
              type: integer
              minimum: 1
        max_pages:
          type: integer
          minimum: 1
          description: Pages per PDF file part
        max_parts:
          type: integer
          minimum: 1
          description: File parts per request, across every message
      example:
        max_bytes:
          image: 5242880
          file: 33554432
        max_duration_seconds:
          audio: 600
        max_pages: 100
        max_parts: 20
    ModelInputLimits:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/InputLimits'
      example:
        claude-sonnet:
          max_bytes:
            image: 5242880
          max_pages: 100
    ModelAliasTarget:
      description: >
        The model id sent to the vendor, or another provider of the same
        project and the model id sent to its vendor. A forward is one hop: its
        target forwards nothing, and is never the provider holding the alias.
      oneOf:
        - type: string
          minLength: 1
        - type: object
          required:
            - ai_provider_id
            - model
          additionalProperties: false
          properties:
            ai_provider_id:
              x-soat-ref: ai-providers
              type: string
              description: The provider whose endpoint and credential serve the alias
              example: aip_V1StGXR8Z5jdHi6B
            model:
              type: string
              minLength: 1
              description: The model id sent to that provider's vendor
              example: gpt-4o-mini

    ProviderPrice:
      type: object
      properties:
        id:
          type: string
          description: Public ID of the price row
          example: price_V1StGXR8Z5jdHi6B
        ai_provider_id:
          x-soat-ref: ai-providers
          type: string
          description: The AI provider instance this override prices
          example: aip_V1StGXR8Z5jdHi6B
        meter_type:
          type: string
          description: Always `llm_tokens` for provider price overrides
        provider:
          type: string
          description: Provider slug (taken from the AI provider instance)
          example: openai
        model:
          type: string
          example: gpt-4o
        component:
          type: string
          description: The token component this row prices (`input_tokens`, `output_tokens`, `cached_tokens`, `cache_write_tokens`)
        unit:
          type: string
          description: Always `token` for provider price overrides
        unit_price:
          type: number
          description: USD per token for this component
        effective_from:
          type: string
          format: date-time
          description: The row with the latest effective_from <= now() prices a call
        created_at:
          type: string
          format: date-time

    ProviderPricesResponse:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ProviderPrice'

    UpsertProviderPricesRequest:
      type: object
      required:
        - prices
      additionalProperties: false
      properties:
        prices:
          type: array
          items:
            type: object
            required:
              - model
              - component
              - unit
              - unit_price
              - effective_from
            additionalProperties: false
            properties:
              model:
                type: string
                example: gpt-4o
              component:
                type: string
                description: The token component this row prices (`input_tokens`, `output_tokens`, `cached_tokens`, `cache_write_tokens`)
              unit:
                type: string
                description: Always `token` for token pricing
              unit_price:
                type: number
                description: USD per token for this component
              effective_from:
                type: string
                format: date-time
                description: Must be in the future; past prices are immutable

    ProviderModelsResponse:
      allOf:
        - $ref: './pagination.yaml#/components/schemas/Page'
        - properties:
            data:
              type: array
              items:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    description: >
                      The provider-native model id, ready to use as `default_model`
                      or an agent's `model`
                    example: gemini-2.5-flash
                  display_name:
                    type: string
                    description: The provider's own human-readable name, when it reports one
                    example: Gemini 2.5 Flash
                  vendor:
                    type: string
                    description: Who makes the model, when the provider reports it
                    example: google
                  input_modalities:
                    type: array
                    description: Lowercased input modalities, when the provider reports them
                    items:
                      type: string
                    example:
                      - text
                      - image
                  output_modalities:
                    type: array
                    description: Lowercased output modalities, when the provider reports them
                    items:
                      type: string
                    example:
                      - text
                  streaming:
                    type: boolean
                    description: Whether the model supports streaming responses
                  lifecycle:
                    type: string
                    description: >
                      `active`, `legacy` or `deprecated`, as the provider reports it.
                      A model that is not `active` still serves today but should not
                      be pinned by anything new.
                    enum:
                      - active
                      - legacy
                      - deprecated
                  inference_types:
                    type: array
                    description: >
                      Lowercased inference types the model supports, when reported.
                      A Bedrock model offering only `inference_profile` must be
                      invoked through a cross-region profile id rather than the bare
                      model id.
                    items:
                      type: string
                    example:
                      - on_demand
                      - inference_profile
                  input_limits:
                    description: >
                      What the model reads per request, as the provider record
                      declares it in `model_input_limits`; absent when it
                      declares none
                    allOf:
                      - $ref: '#/components/schemas/InputLimits'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT token or sk_ api key
