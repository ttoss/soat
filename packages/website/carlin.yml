hostedZoneName: ttoss.dev

environments:
  Production:
    aliases:
      - soat.ttoss.dev
    cloudfront: true
    # `appendIndexHtml` is not set: a cache behavior takes a single viewer
    # request function, and this one calls the `appendIndexHtml` helper carlin
    # injects into it after negotiating the page representation.
    viewerRequestFunctionCode: ./cloudfront/viewerRequest.js
    # `responseHeaders` is unset: CloudFront rejects `access-control-*` as
    # custom headers, which is how carlin builds the policy when `vary` is
    # defined, so the deploy fails. The distribution keeps the managed policy —
    # negotiation and CORS work, `Vary: Accept` is not sent (#1111).
