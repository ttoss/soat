<!-- @dsCard group="Brand" viewport="760x300" name="The mark" subtitle="S◻AT wordmark and the boundary-and-core symbol, from the SVG masters" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 0; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; min-height: 300px; }
  .panel { display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 36px; }
  .dark { background: var(--space-black); }
  .light { background: var(--pure-white); }
  .wordmark { height: 44px; width: auto; align-self: flex-start; }
  .symbols { display: flex; align-items: flex-end; gap: 22px; }
</style>
</head>
<body>
<div class="stage">
  <div class="panel dark">
    <img class="wordmark" src="../../../../packages/website/static/img/brand/soat-wordmark-dark.svg" alt="SOAT wordmark on dark" />
    <div class="symbols">
      <img src="../../../../packages/website/static/img/brand/soat-symbol-dark.svg" width="96" height="96" alt="SOAT symbol on dark, 96 px" />
      <img src="../../../../packages/website/static/img/brand/soat-symbol-dark.svg" width="32" height="32" alt="SOAT symbol on dark, 32 px" />
      <img src="../../../../packages/website/static/img/brand/favicon.svg" width="16" height="16" alt="SOAT favicon, 16 px" />
    </div>
  </div>
  <div class="panel light">
    <img class="wordmark" src="../../../../packages/website/static/img/brand/soat-wordmark-light.svg" alt="SOAT wordmark on light" />
    <div class="symbols">
      <img src="../../../../packages/website/static/img/brand/soat-symbol-light.svg" width="96" height="96" alt="SOAT symbol on light, 96 px" />
      <img src="../../../../packages/website/static/img/brand/soat-symbol-light.svg" width="32" height="32" alt="SOAT symbol on light, 32 px" />
    </div>
  </div>
</div>
</body>
</html>
