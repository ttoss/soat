services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  database:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: soat_tutorials
      POSTGRES_USER: soat_user
      POSTGRES_PASSWORD: soat_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soat_user -d soat_tutorials']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.20.6
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    environment:
      OLLAMA_NUM_CTX: '16384'
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama serve & sleep 5 && (ollama list | grep -q qwen3-embedding:0.6b || ollama pull qwen3-embedding:0.6b) && (ollama list | grep -q qwen2.5:0.5b || ollama pull qwen2.5:0.5b) && wait'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ollama list | grep qwen3-embedding && ollama list | grep qwen2.5:0.5b',
        ]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 60s

  # Ollama's OpenAI-compatible endpoint silently drops `tool_choice`, so a forced
  # tool call is not actually forced and the run pauses only when the 0.5b model
  # volunteers one. This shim implements that field deterministically and forwards
  # everything else (embeddings included) to the real Ollama.
  # See tests/mocks/ollamaToolChoiceProxy.mjs.
  ollama-tool-choice:
    image: node:22-alpine
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./mocks/ollamaToolChoiceProxy.mjs:/ollamaToolChoiceProxy.mjs:ro
    command: ['node', '/ollamaToolChoiceProxy.mjs']
    environment:
      PORT: '11434'
      OLLAMA_UPSTREAM_URL: 'http://ollama:11434'
      # Only these tools have their forcing honored deterministically:
      # get_order_status (client-tools), record_order (tool-context),
      # docs_update-document (boundary-policy) and read_local_file
      # (build-an-agent-harness). Every other forced tool goes to the real model.
      #
      # The last two qualify on the allowlist's own criterion — their assertions are
      # about dispatch, not argument quality: boundary_policy refuses the action
      # before it runs, and the client-tool tutorial synthesizes the output itself.
      # Left off the list, both would pass *vacuously* whenever qwen2.5:0.5b declines
      # to call the tool — green CI proving nothing.
      #
      # The sonnet-workshop tools (multi-agent-orchestration, formations) were
      # deliberately left off while an unhonored `tool_choice` merely went
      # unforced. `ai` 7.0.99 enforces it, so the same request now fails the
      # generation outright — the status quo that judgment preferred is gone.
      # Six of them pin every parameter, so the model sees an empty schema and
      # a synthesized call is exact; only poem-write's `content` is the model's,
      # and no tutorial asserts the poem it writes.
      TOOL_CHOICE_TOOLS: 'get_order_status,record_order,docs_update-document,read_local_file,call-stanza-1_create-agent-generation,call-stanza-2_create-agent-generation,call-stanza-3_create-agent-generation,call-stanza-4_create-agent-generation,read-final-poem_get-document,poem-read_get-document,poem-write_update-document'
      # Nothing bounds how many tokens qwen2.5:0.5b emits (agents have no max_tokens
      # field) and no tutorial asserts generated content, so uncapped output is what
      # makes a multi-generation tutorial's wall-clock swing by minutes and push its
      # poll loops past their budget. Same value and rationale as the smoke stack.
      MAX_COMPLETION_TOKENS: '256'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:11434/health',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  # Deterministic stand-ins for the provider APIs the converter tutorial calls:
  # the OpenAI Responses API for the image agent converter and an xAI-shaped
  # speech-to-text endpoint for the audio tool converter. Both validate the bytes
  # the tutorial sent against the checked-in fixtures before returning canned
  # text, so a broken tutorial fails loudly. See tests/mocks/mock-providers.mjs.
  mock-providers:
    image: node:22-alpine
    volumes:
      - ./mocks/mock-providers.mjs:/mock-providers.mjs:ro
      - ../packages/website/docs/tutorials/fixtures:/fixtures:ro
    command: ['node', '/mock-providers.mjs']
    environment:
      PORT: '8090'
      FIXTURES_DIR: '/fixtures'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:8090/health',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  # The schema step a deploy runs before the service rolls (#548). Same image as
  # `server`, started at the `migrate.mjs` entrypoint; it applies the pending
  # migrations, syncs, and exits. `server` waits for it to exit 0, so it never
  # boots against a schema it does not match — which is what lets it run with
  # the boot-time sync off, exactly as a deployment does.
  migrate:
    image: soat-tutorials-server
    # The tag is local-only, produced by `server`'s build. Without this Compose
    # would try the registry when it is missing and fail with a misleading
    # "pull access denied" instead of naming the real problem.
    pull_policy: never
    command: ['node', 'packages/server/dist/migrate.mjs', 'run']
    restart: 'no'
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: soat_tutorials
      DATABASE_USER: soat_user
      DATABASE_PASSWORD: soat_password
      # `DocumentChunk` sizes its vector column from this at module load, so the
      # migrate process needs it as much as the server does.
      EMBEDDING_DIMENSIONS: '1024'

  server:
    # Named so `migrate` can reuse this exact image instead of declaring its own
    # identical `build:`, which Compose would build and export a second time.
    image: soat-tutorials-server
    build:
      context: ..
      target: production
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-tool-choice:
        condition: service_healthy
    environment:
      PORT: 5047
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: soat_tutorials
      DATABASE_USER: soat_user
      DATABASE_PASSWORD: soat_password
      # Tool egress is default-deny for non-public destinations (see
      # packages/server/src/lib/toolEgress.ts), so these sibling containers are
      # exactly the case an operator has to declare: `server` for soat self-call
      # tools, `tutorials:8788` for the echo listener, `tutorials:8787` for the
      # webhook listener a delivery is sent to, and `mock-providers` for the
      # speech-to-text tool an ingestion converter drives (a converter invokes a
      # tool, so it is egress-checked like any other tool call) and for the
      # `base_url` the vision provider is created with.
      TOOL_EGRESS_ALLOWED_HOSTS: server:5047,tutorials:8787,tutorials:8788,mock-providers:8090
      SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: tutorials-test-jwt-secret
      FILES_STORAGE_DIR: /data/files
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_INPUT_1M_TOKEN_PRICE_USD: '0.02'
      EMBEDDING_DIMENSIONS: '1024'
      OLLAMA_BASE_URL: http://ollama-tool-choice:11434
      NODE_OPTIONS: '--max-old-space-size=768'
      DEBUG: 'soat:*'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:5047/health',
          (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Tutorial validator ───────────────────────────────────────────────────────
  # Runs all tutorials not listed in tests/.tutorialsignore.
  # Pass TUTORIAL_ID=<name> (without .md) to run a single tutorial, e.g.:
  #   TUTORIAL_ID=permissions docker compose -f tests/docker-compose.tutorials.yml up tutorials

  tutorials:
    build:
      context: ..
      target: smoke-test
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      server:
        condition: service_healthy
      mock-providers:
        condition: service_healthy
    environment:
      SOAT_BASE_URL: 'http://server:5047'
      SOAT_WEBHOOK_BASE_URL: 'http://tutorials:8787'
      # Tutorials run in parallel inside this one container, so a listener port
      # can only belong to one of them. 8787 is the webhook listener
      # (chat-with-llm); 8788 is the tool-context tutorial's header-echo
      # endpoint. A second tutorial that needs its own listener takes the next
      # port and its own variable rather than sharing one of these.
      SOAT_TOOL_ECHO_BASE_URL: 'http://tutorials:8788'
      TUTORIAL_ID: '${TUTORIAL_ID:-}'
      VERBOSE: '0'
      # Point the converter tutorial's provider endpoints at the mock service.
      # The server (which makes the actual outbound calls) reaches these over the
      # compose network; dummy keys are ignored by the mocks.
      OPENAI_BASE_URL: 'http://mock-providers:8090/v1'
      OPENAI_API_KEY: 'test-openai-key'
      XAI_BASE_URL: 'http://mock-providers:8090/v1'
      XAI_API_KEY: 'test-xai-key'
      # The converter tutorial reads its fixtures straight off disk (see
      # fixtures/ under the mounted /tutorials volume below) instead of
      # embedding base64 blobs inline.
      FIXTURES_DIR: '/tutorials/fixtures'
    volumes:
      - ../packages/website/docs/tutorials:/tutorials:ro
      - ./tutorials-tests.sh:/tutorials-tests.sh:ro
      - ./run-tutorials.sh:/run-tutorials.sh:ro
      - ./.tutorialsignore:/repo/tests/.tutorialsignore:ro
    command:
      - bash
      - -c
      - |
        export PATH="/app/node_modules/.bin:$$PATH"
        bash /run-tutorials.sh
