services:
  database:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: soat_test
      POSTGRES_USER: soat_user
      POSTGRES_PASSWORD: soat_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soat_user -d soat_test']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.20.6
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    environment:
      OLLAMA_NUM_CTX: '16384'
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama serve & sleep 5 && (ollama list | grep -q qwen3-embedding:0.6b || ollama pull qwen3-embedding:0.6b) && (ollama list | grep -q qwen2.5:0.5b || ollama pull qwen2.5:0.5b) && wait'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ollama list | grep qwen3-embedding && ollama list | grep qwen2.5:0.5b',
        ]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 60s

  # Ollama's OpenAI-compatible endpoint does not implement `tool_choice` — it
  # silently drops the field — so the client-tool step's forced tool call is not
  # actually forced and the pause depends on what the 0.5b model decides. This
  # shim implements that one missing field deterministically and forwards
  # everything else (including embeddings) to the real Ollama.
  # See tests/mocks/ollamaToolChoiceProxy.mjs.
  ollama-tool-choice:
    image: node:22-alpine
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./mocks/ollamaToolChoiceProxy.mjs:/ollamaToolChoiceProxy.mjs:ro
    command: ['node', '/ollamaToolChoiceProxy.mjs']
    environment:
      PORT: '11434'
      OLLAMA_UPSTREAM_URL: 'http://ollama:11434'
      # Only these tools have their forcing honored deterministically — the client-tool smoke step.
      # Every other forced tool still goes to the real model.
      TOOL_CHOICE_TOOLS: 'get_weather'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:11434/health',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      target: production
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-tool-choice:
        condition: service_healthy
    environment:
      PORT: 50477
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: soat_test
      DATABASE_USER: soat_user
      DATABASE_PASSWORD: soat_password
      SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: smoke-test-jwt-secret
      FILES_STORAGE_DIR: /data/files
      OLLAMA_BASE_URL: http://ollama-tool-choice:11434
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: '1024'
      NODE_OPTIONS: '--max-old-space-size=768'
      SOAT_BASE_URL: 'http://server:50477'
      # Worker-fleet topology: the API tier stays request-only and the
      # standalone `worker` service below owns draining the orchestration queue.
      ORCHESTRATION_WORKER_DISABLED: 'true'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:50477/health',
          (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Standalone orchestration worker fleet: the same production image started at
  # the `worker.mjs` entrypoint, so it runs only the scheduler tick + queue
  # worker loop with no HTTP listener. With `ORCHESTRATION_WORKER_DISABLED=true`
  # on the API service, this process is the only thing draining the queue —
  # which is exactly what the worker-fleet smoke steps assert.
  worker:
    build:
      context: ..
      target: production
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    command: ['node', '--enable-source-maps', 'packages/server/dist/worker.mjs']
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-tool-choice:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: soat_test
      DATABASE_USER: soat_user
      DATABASE_PASSWORD: soat_password
      SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: smoke-test-jwt-secret
      FILES_STORAGE_DIR: /data/files
      OLLAMA_BASE_URL: http://ollama-tool-choice:11434
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: '1024'
      NODE_OPTIONS: '--max-old-space-size=768'
      SOAT_BASE_URL: 'http://server:50477'
      ORCHESTRATION_WORKER_INTERVAL_MS: '1000'
      ORCHESTRATION_SCHEDULER_INTERVAL_MS: '1000'
      ORCHESTRATION_WORKER_HEARTBEAT_FILE: /tmp/soat-orchestration-worker.heartbeat
      ORCHESTRATION_WORKER_HEARTBEAT_STALE_MS: '15000'
    # The worker serves no HTTP, so liveness is the freshness of the heartbeat
    # it republishes after every successful queue claim.
    healthcheck:
      test:
        - CMD
        - node
        - packages/server/dist/workerHealthcheck.mjs
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  smoke-test:
    build:
      context: ..
      target: smoke-test
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      SERVER_URL: 'http://server:50477'
      OLLAMA_URL: 'http://ollama-tool-choice:11434'
