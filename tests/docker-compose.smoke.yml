services:
  database:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: soat_test
      POSTGRES_USER: soat_user
      POSTGRES_PASSWORD: soat_password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soat_user -d soat_test']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.20.6
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    # Ollama ignores SIGTERM until its default timeout; nothing here is worth
    # draining.
    stop_grace_period: 2s
    environment:
      # NOTE: Ollama does not read `OLLAMA_NUM_CTX` — the variable it honours is
      # `OLLAMA_CONTEXT_LENGTH`. This setting has therefore never taken effect:
      # the 2026-08-05 run logged `OLLAMA_CONTEXT_LENGTH:0` and a runner
      # `n_ctx = 4096` (the default). Left in place deliberately rather than
      # "fixed" — raising the real context to 16384 would slow every generation
      # on a CPU-only runner, and no smoke assertion is known to need it. Decide
      # what context the suite actually wants before renaming this.
      OLLAMA_NUM_CTX: '16384'
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama serve & sleep 5 && (ollama list | grep -q qwen3-embedding:0.6b || ollama pull qwen3-embedding:0.6b) && (ollama list | grep -q qwen2.5:0.5b || ollama pull qwen2.5:0.5b) && wait'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ollama list | grep qwen3-embedding && ollama list | grep qwen2.5:0.5b',
        ]
      interval: 10s
      timeout: 30s
      retries: 60
      start_period: 60s

  # Ollama's OpenAI-compatible endpoint does not implement `tool_choice` — it
  # silently drops the field — so the client-tool step's forced tool call is not
  # actually forced and the pause depends on what the 0.5b model decides. This
  # shim implements that one missing field deterministically and forwards
  # everything else (including embeddings) to the real Ollama.
  # See tests/mocks/ollamaToolChoiceProxy.mjs.
  ollama-tool-choice:
    image: node:22-alpine
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./mocks/ollamaToolChoiceProxy.mjs:/ollamaToolChoiceProxy.mjs:ro
    command: ['node', '/ollamaToolChoiceProxy.mjs']
    stop_grace_period: 2s
    environment:
      PORT: '11434'
      OLLAMA_UPSTREAM_URL: 'http://ollama:11434'
      # Only these tools have their forcing honored deterministically — the client-tool smoke step.
      # Every other forced tool still goes to the real model.
      TOOL_CHOICE_TOOLS: 'get_weather'
      # Nothing bounds how many tokens qwen2.5:0.5b emits per completion (agents
      # have no max_tokens field), and the smoke assertions are structural, never
      # about content — so cap the output here. 256 leaves ample room for a
      # volunteered tool call's JSON while bounding the runaway generations that
      # made the job swing by minutes between identical runs.
      MAX_COMPLETION_TOKENS: '256'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:11434/health',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    # Named so `worker` can reuse this exact image instead of declaring its own
    # identical `build:`. Two build blocks with the same context and target
    # produce byte-identical images, but Compose still builds and exports both —
    # ~20s of the job spent writing the same layers to the daemon twice.
    image: soat-smoke-server
    build:
      context: ..
      target: production
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    # The API tier does not exit on SIGTERM within Compose's default 10s grace
    # period, so teardown waited the full timeout for it (and for both Ollama
    # services below). This is a throwaway stack — nothing here needs to drain.
    stop_grace_period: 2s
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-tool-choice:
        condition: service_healthy
    environment:
      PORT: 50477
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: soat_test
      DATABASE_USER: soat_user
      DATABASE_PASSWORD: soat_password
      # Tool egress is default-deny for non-public destinations (see
      # packages/server/src/lib/toolEgress.ts). These suites point http and mcp
      # tools at sibling containers, which is exactly the case an operator has
      # to declare.
      TOOL_EGRESS_ALLOWED_HOSTS: server:50477
      SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: smoke-test-jwt-secret
      FILES_STORAGE_DIR: /data/files
      OLLAMA_BASE_URL: http://ollama-tool-choice:11434
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: '1024'
      NODE_OPTIONS: '--max-old-space-size=768'
      SOAT_BASE_URL: 'http://server:50477'
      # Worker-fleet topology: the API tier stays request-only and the
      # standalone `worker` service below owns draining the orchestration queue.
      ORCHESTRATION_WORKER_DISABLED: 'true'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - >-
          require('http').get('http://localhost:50477/health',
          (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }
          ).on('error', () => process.exit(1))
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Standalone orchestration worker fleet: the same production image started at
  # the `worker.mjs` entrypoint, so it runs only the scheduler tick + queue
  # worker loop with no HTTP listener. With `ORCHESTRATION_WORKER_DISABLED=true`
  # on the API service, this process is the only thing draining the queue —
  # which is exactly what the worker-fleet smoke steps assert.
  worker:
    # Same image as `server` — only the entrypoint differs, and `command`
    # overrides that at runtime. Compose builds it once, under `server`.
    image: soat-smoke-server
    # The tag is local-only, produced by `server`'s build. Without this Compose
    # would try the registry when it is missing and fail with a misleading
    # "pull access denied" instead of naming the real problem.
    pull_policy: never
    command: ['node', '--enable-source-maps', 'packages/server/dist/worker.mjs']
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-tool-choice:
        condition: service_healthy
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_NAME: soat_test
      DATABASE_USER: soat_user
      DATABASE_PASSWORD: soat_password
      # Tool egress is default-deny for non-public destinations (see
      # packages/server/src/lib/toolEgress.ts). These suites point http and mcp
      # tools at sibling containers, which is exactly the case an operator has
      # to declare.
      TOOL_EGRESS_ALLOWED_HOSTS: server:50477
      SECRETS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: smoke-test-jwt-secret
      FILES_STORAGE_DIR: /data/files
      OLLAMA_BASE_URL: http://ollama-tool-choice:11434
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIMENSIONS: '1024'
      NODE_OPTIONS: '--max-old-space-size=768'
      SOAT_BASE_URL: 'http://server:50477'
      ORCHESTRATION_WORKER_INTERVAL_MS: '1000'
      ORCHESTRATION_SCHEDULER_INTERVAL_MS: '1000'
      ORCHESTRATION_WORKER_HEARTBEAT_FILE: /tmp/soat-orchestration-worker.heartbeat
      ORCHESTRATION_WORKER_HEARTBEAT_STALE_MS: '15000'
    # The worker serves no HTTP, so liveness is the freshness of the heartbeat
    # it republishes after every successful queue claim.
    healthcheck:
      test:
        - CMD
        - node
        - packages/server/dist/workerHealthcheck.mjs
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s

  smoke-test:
    build:
      context: ..
      target: smoke-test
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      SERVER_URL: 'http://server:50477'
      OLLAMA_URL: 'http://ollama-tool-choice:11434'
